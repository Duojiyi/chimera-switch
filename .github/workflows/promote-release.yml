name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Complete prerelease tag to promote (e.g. v3.20.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified prerelease
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Checkout trusted verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Download and verify every prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf "%s" "$TAG" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "::error::Tag must match vX.Y.Z"
            exit 1
          fi
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          if [ "$(printf "%s" "$release" | jq -r .isDraft)" != false ] || [ "$(printf "%s" "$release" | jq -r .isPrerelease)" != true ]; then
            echo "::error::$TAG must be an existing prerelease, not a draft or stable release."
            exit 1
          fi
          rm -rf release-assets
          mkdir -p release-assets
          # Download without a pattern so verification sees the complete release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          node scripts/verify-release-assets.mjs release-assets "$TAG" "$GITHUB_REPOSITORY" release-assets/latest.json "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK"

      - name: Promote only after verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted $TAG to the latest stable release."

      # A GITHUB_TOKEN-authored release edit does not fan out to another
      # workflow. Dispatch the mirror explicitly and wait for the real run so
      # a green promotion cannot silently leave R2 stale.
      - name: Dispatch and verify R2 synchronization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%s)
          gh workflow run sync-r2.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          sync_run_id=""
          for attempt in $(seq 1 30); do
            sync_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync-r2.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "map(select((.createdAt | fromdateiso8601) >= $dispatched_at)) | .[0].databaseId // empty" || true)
            if [ -n "$sync_run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$sync_run_id" ]; then
            echo "::error::R2 synchronization was dispatched but no run appeared within 60 seconds."
            exit 1
          fi
          echo "Waiting for R2 synchronization run $sync_run_id."
          gh run watch "$sync_run_id" --repo "$GITHUB_REPOSITORY" --exit-status

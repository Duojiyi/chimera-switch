name: Sync upstream

# 上游 cc-switch（farion1231/cc-switch）发版后自动同步去广告版。
# 同步使用 SYNC_TOKEN：必须能读写本仓库 Contents/Workflows，若保留 issue 通知还需
# Issues 写权限。默认 GITHUB_TOKEN 不会触发本仓库后续的 tag release workflow。
# release.yml 先以 prerelease 发布；完成人工验收后再转正，届时 sync-r2.yml 才会
# 更新公开的 latest.json 和下载站根 manifest。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is missing. Configure a repository-scoped PAT with Contents and Workflows write permission."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY" >/dev/null
          scopes=$(curl --fail --silent --show-error --dump-header - -o /dev/null \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | awk -F': ' 'tolower($1) == "x-oauth-scopes" {print tolower($2)}' | tr -d '\r')
          # Classic OAuth/PAT tokens expose scopes. Fine-grained PATs do not, so
          # an empty header is accepted and the real push/dispatch remains the final check.
          if [ -n "$scopes" ] && ! printf '%s' "$scopes" | tr ',' '\n' | sed 's/^ *//' | grep -qx workflow; then
            echo "::error::SYNC_TOKEN is a classic token without the workflow scope (scopes: $scopes)."
            echo "Create a fine-grained PAT with Contents: Read and write and Workflows: Read and write, then replace the SYNC_TOKEN secret."
            exit 1
          fi
          echo "SYNC_TOKEN can access $REPOSITORY"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_TOKEN }}
          # Do not leave the write-capable token in .git/config while upstream
          # code is installed, formatted, typechecked, or tested.
          persist-credentials: false

      - name: Add and fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/farion1231/cc-switch.git 2>/dev/null || true
          git fetch upstream --tags --prune --force

      - name: Detect latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # /releases/latest is the upstream stable-release source of truth.
          # If GitHub API resolution fails, stop loudly instead of guessing from
          # tags, because a tag can exist without being a published stable release.
          release=$(gh api repos/farion1231/cc-switch/releases/latest)
          TAG=$(printf '%s' "$release" | jq -r '.tag_name // empty')
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest upstream release has no valid stable tag (received: $TAG)"
            exit 1
          fi
          if [ "$(printf '%s' "$release" | jq -r '.draft')" != false ] || [ "$(printf '%s' "$release" | jq -r '.prerelease')" != false ]; then
            echo "::error::Upstream latest release $TAG is draft/prerelease; refusing automatic sync."
            exit 1
          fi
          UPSTREAM_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! printf '%s' "$UPSTREAM_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve immutable upstream commit for $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable release: $TAG ($UPSTREAM_SHA)"

      - name: Check existing tag and release
        id: check
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +e
          origin_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>/dev/null)
          origin_status=$?
          set -e
          if [ "$origin_status" -ne 0 ] && [ "$origin_status" -ne 2 ]; then
            echo "::error::Could not inspect origin tag $TAG (git ls-remote exit $origin_status)."
            exit 1
          fi
          if [ -z "$origin_refs" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is not on origin; a normal upstream sync is required."
            exit 0
          fi

          origin_tag_sha=$(printf '%s\n' "$origin_refs" | awk -v tag_ref="refs/tags/$TAG^{}" '$2 == tag_ref { print $1; exit }')
          if [ -z "$origin_tag_sha" ]; then
            origin_tag_sha=$(printf '%s\n' "$origin_refs" | awk -v tag_ref="refs/tags/$TAG" '$2 == tag_ref { print $1; exit }')
          fi
          if ! printf '%s' "$origin_tag_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve immutable origin commit for tag $TAG"
            exit 1
          fi
          # The local release tag points to the post-sync commit, which includes
          # debranding and quality-gate changes after the upstream commit. It is
          # therefore expected to differ from the upstream tag SHA. Verify the
          # immutable tag instead by requiring the upstream commit in its history.
          if ! git cat-file -e "$origin_tag_sha^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags origin "$origin_tag_sha"
          fi
          if ! git merge-base --is-ancestor "${{ steps.upstream.outputs.sha }}" "$origin_tag_sha"; then
            echo "::error::Origin tag $TAG points to $origin_tag_sha without upstream commit ${{ steps.upstream.outputs.sha }} in its history; refusing to treat it as this upstream release."
            exit 1
          fi

          echo "Tag $TAG already exists at immutable commit $origin_tag_sha and contains the upstream release commit. Checking whether its Release is complete."
          release_data=$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null || true)
          ready=true
          if [ -z "$release_data" ] || [ "$(printf '%s' "$release_data" | jq -r '.isDraft')" != false ]; then
            ready=false
          fi
          required=(
            "Chimera-Switch-$TAG-macOS.tar.gz"
            "Chimera-Switch-$TAG-macOS.tar.gz.sig"
            "Chimera-Switch-$TAG-Windows.msi"
            "Chimera-Switch-$TAG-Windows.msi.sig"
            "Chimera-Switch-$TAG-Windows-arm64.msi"
            "Chimera-Switch-$TAG-Windows-arm64.msi.sig"
            "Chimera-Switch-$TAG-Linux-x86_64.AppImage"
            "Chimera-Switch-$TAG-Linux-x86_64.AppImage.sig"
            "Chimera-Switch-$TAG-Linux-arm64.AppImage"
            "Chimera-Switch-$TAG-Linux-arm64.AppImage.sig"
            "latest.json"
          )
          for asset in "${required[@]}"; do
            if ! printf '%s' "$release_data" | jq -e --arg asset "$asset" '.assets[].name | select(. == $asset)' >/dev/null; then
              echo "Missing Release asset: $asset"
              ready=false
            fi
          done
          if [ "$ready" = true ]; then
            if [ "$(printf '%s' "$release_data" | jq -r '.isPrerelease')" = true ]; then
              echo "Release $TAG is complete but remains a prerelease; manual promotion is required."
              echo "prerelease_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG is complete and stable; nothing to do."
              echo "prerelease_ready=false" >> "$GITHUB_OUTPUT"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release $TAG is missing or incomplete; dispatching release.yml recovery."
          dispatched_at=$(date -u +%s)
          gh workflow run release.yml --repo "$REPOSITORY" --ref main -f tag="$TAG"
          recovery_run_id=""
          for attempt in $(seq 1 30); do
            recovery_run_id=$(gh run list --repo "$REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "map(select((.createdAt | fromdateiso8601) >= $dispatched_at)) | .[0].databaseId // empty" || true)
            if [ -n "$recovery_run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$recovery_run_id" ]; then
            echo "::error::Recovery workflow was dispatched but no run appeared within 60 seconds."
            exit 1
          fi
          echo "Recovery workflow $recovery_run_id started; waiting for its actual result."
          if ! gh run watch "$recovery_run_id" --repo "$REPOSITORY" --exit-status; then
            echo "::error::Recovery workflow $recovery_run_id failed; upstream sync is incomplete."
            exit 1
          fi
          echo "Recovery workflow $recovery_run_id completed successfully; upstream sync is complete."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        if: steps.check.outputs.skip != 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          corepack install

      - name: Merge upstream (targeted conflict resolution)
        id: merge
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA=$(git rev-parse HEAD)

          restore_trusted_paths() {
            # Keep automation and release tooling from the checked-out origin
            # baseline. This also removes newly added upstream files in these
            # directories, not only conflicting files.
            git rm -r -q --ignore-unmatch .github scripts || true
            git checkout "$BASE_SHA" -- .github scripts
            git add .github scripts
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
              echo "Restored trusted .github and scripts from $BASE_SHA"
            fi
          }

          if git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
            restore_trusted_paths
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "合并冲突，按已知类别自动解决…"
          UNRESOLVED=0
          while IFS= read -r f; do
            has_ours=$(git ls-files -u -- "$f" | awk '$3==2' | wc -l)
            has_theirs=$(git ls-files -u -- "$f" | awk '$3==3' | wc -l)
            case "$f" in
              src-tauri/tauri.conf.json|src-tauri/Info.plist|src-tauri/icons/*|README.md|README_*.md|.github/*|scripts/*|assets/*|flatpak/*|deplink.html|CONTRIBUTING.md|SECURITY.md|SUPPORT.md|CODE_OF_CONDUCT.md|.gitignore|.gitattributes|LICENSE)
                if [ "$has_ours" -gt 0 ]; then
                  git checkout --ours -- "$f" && git add -- "$f"
                  echo "  ours   $f"
                else
                  git rm -q -f -- "$f"
                  echo "  rm     $f"
                fi ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|src-tauri/Cargo.toml|src-tauri/Cargo.lock|src/*|src-tauri/*|tests/*|docs/*|CHANGELOG.md|index.html|session-manager.md|*.config.*|tsconfig*.json|components.json|.node-version|rust-toolchain.toml)
                if [ "$has_ours" -eq 0 ] || [ "$has_theirs" -eq 0 ]; then
                  git rm -q -f -- "$f"
                  echo "  rm     $f"
                else
                  git checkout --theirs -- "$f" && git add -- "$f"
                  echo "  theirs $f"
                fi ;;
              *)
                echo "  ??     $f（无既定策略）"
                UNRESOLVED=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=U)

          if [ "$UNRESOLVED" -ne 0 ]; then
            echo "存在无法自动解决的冲突路径，放弃合并。"
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --no-edit
          restore_trusted_paths
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Re-debrand, align version and run quality gates
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'false'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/debrand.mjs
          node scripts/align-version.mjs "${TAG#v}"
          cargo fmt --manifest-path src-tauri/Cargo.toml
          pnpm install --frozen-lockfile
          pnpm format
          pnpm typecheck
          pnpm test:unit
          node scripts/check-debrand.mjs
          git add -A
          git commit -m "sync: merge upstream $TAG and re-apply debrand" || echo "nothing to commit"

      - name: Create and merge sync PR
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'false'
        timeout-minutes: 90
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          branch_name="automation/upstream-sync-$TAG"
          push_root=$(mktemp -d)
          trap 'rm -rf "$push_root"' EXIT
          push_repo="$push_root/repository"

          # Never push a branch from the checkout that processed upstream files.
          # The clean repository contains only the exact validated commit.
          git init --quiet "$push_repo"
          git -C "$push_repo" config user.name "github-actions[bot]"
          git -C "$push_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$push_repo" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$push_repo" -c protocol.file.allow=always fetch --quiet --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C "$push_repo" switch --quiet --create "$branch_name" FETCH_HEAD

          remote_branch_sha=$(git ls-remote origin "refs/heads/$branch_name" | awk 'NR == 1 {print $1}')
          if [ -n "$remote_branch_sha" ] && [ "$remote_branch_sha" != "$local_sha" ]; then
            echo "::error::Sync branch $branch_name already exists at a different commit; refusing to overwrite it."
            exit 1
          fi
          if [ -z "$remote_branch_sha" ]; then
            git -C "$push_repo" -c "http.extraheader=AUTHORIZATION: bearer $SYNC_TOKEN" \
              push --atomic origin "HEAD:refs/heads/$branch_name"
          else
            echo "Reusing existing sync branch $branch_name at $remote_branch_sha."
          fi

          pr_number=$(GH_TOKEN="$SYNC_TOKEN" gh pr list --repo "$REPOSITORY" \
            --head "$branch_name" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_number=$(GH_TOKEN="$SYNC_TOKEN" gh pr create --repo "$REPOSITORY" \
              --base main \
              --head "$branch_name" \
              --title "sync: merge upstream $TAG" \
              --body "Automated upstream sync for $TAG. CI must pass before this PR is merged. Run: $RUN_URL")
          fi
          echo "Sync PR: #$pr_number"

          # Do not rely solely on branch protection: this workflow must remain
          # safe while protection is being configured or if it is accidentally
          # weakened. Wait for the stable orchestration check explicitly.
          for attempt in $(seq 1 180); do
            pr_data=$(GH_TOKEN="$SYNC_TOKEN" gh pr view "$pr_number" --repo "$REPOSITORY" \
              --json state,statusCheckRollup)
            if printf '%s' "$pr_data" | jq -e '.state == "CLOSED"' >/dev/null; then
              echo "::error::Sync PR #$pr_number was closed before CI completed."
              exit 1
            fi
            gate_conclusion=$(printf '%s' "$pr_data" | jq -r '[.statusCheckRollup[]? | select(.name == "CI Gate") | .conclusion] | last // empty')
            failed_checks=$(printf '%s' "$pr_data" | jq '[.statusCheckRollup[]? | select((.conclusion // .state // "") | IN("FAILURE", "ERROR", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"))] | length')
            if [ "$failed_checks" -gt 0 ]; then
              echo "::error::Sync PR #$pr_number has a failed status check."
              exit 1
            fi
            if [ "$gate_conclusion" = "SUCCESS" ]; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "::error::CI Gate did not pass for sync PR #$pr_number within the timeout."
              exit 1
            fi
            sleep 30
          done

          # Auto-merge is still used so required reviews/checks remain enforced;
          # no admin bypass is used. CI Gate has already passed above.
          GH_TOKEN="$SYNC_TOKEN" gh pr merge "$pr_number" --auto --squash --delete-branch

          merged_sha=""
          for attempt in $(seq 1 120); do
            pr_data=$(GH_TOKEN="$SYNC_TOKEN" gh pr view "$pr_number" --repo "$REPOSITORY" \
              --json state,mergeCommit,statusCheckRollup)
            merged_sha=$(printf '%s' "$pr_data" | jq -r '.mergeCommit.oid // empty')
            if printf '%s' "$pr_data" | jq -e '.state == "MERGED"' >/dev/null && [ -n "$merged_sha" ]; then
              break
            fi
            if printf '%s' "$pr_data" | jq -e '.state == "CLOSED"' >/dev/null; then
              echo "::error::Sync PR #$pr_number was closed without merging."
              exit 1
            fi
            failed_checks=$(printf '%s' "$pr_data" | jq '[.statusCheckRollup[]? | select((.conclusion // .state // "") | IN("FAILURE", "ERROR", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"))] | length')
            if [ "$failed_checks" -gt 0 ]; then
              echo "::error::Sync PR #$pr_number has failed required checks."
              exit 1
            fi
            sleep 30
          done
          if [ -z "$merged_sha" ]; then
            echo "::error::Sync PR #$pr_number was not merged within the timeout."
            exit 1
          fi

          # Tag the exact protected main commit produced by the merge. Tags are
          # write-once: an existing tag is accepted only at the same commit.
          tag_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_tag_sha=$(printf '%s\n' "$tag_refs" | awk -v tag_ref="refs/tags/$TAG^{}" '$2 == tag_ref {print $1; exit}')
          if [ -z "$remote_tag_sha" ]; then
            remote_tag_sha=$(printf '%s\n' "$tag_refs" | awk -v tag_ref="refs/tags/$TAG" '$2 == tag_ref {print $1; exit}')
          fi
          if [ -n "$remote_tag_sha" ] && [ "$remote_tag_sha" != "$merged_sha" ]; then
            echo "::error::Tag $TAG already exists at $remote_tag_sha, not merged commit $merged_sha."
            exit 1
          fi
          if [ -z "$remote_tag_sha" ]; then
            # Squash merging creates a new commit that was not present in the
            # pre-merge clean repository. Fetch the protected main history
            # before creating the write-once tag, and verify the merge SHA is
            # actually reachable from main.
            git -C "$push_repo" -c "http.extraheader=AUTHORIZATION: bearer $SYNC_TOKEN" \
              fetch --quiet --no-tags origin refs/heads/main
            if ! git -C "$push_repo" cat-file -e "$merged_sha^{commit}"; then
              echo "::error::Merged PR commit $merged_sha is not available from origin/main."
              exit 1
            fi
            if ! git -C "$push_repo" merge-base --is-ancestor "$merged_sha" FETCH_HEAD; then
              echo "::error::Merged PR commit $merged_sha is not an ancestor of origin/main."
              exit 1
            fi
            git -C "$push_repo" tag -a "$TAG" "$merged_sha" -m "Release $TAG"
            git -C "$push_repo" -c "http.extraheader=AUTHORIZATION: bearer $SYNC_TOKEN" \
              push --atomic origin "refs/tags/$TAG"
          else
            echo "Tag $TAG already points at the merged commit; leaving it untouched."
          fi

      - name: Notify conflict
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="sync: 手动合并上游 $TAG"
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'length' || echo 0)
          if [ "$COUNT" -gt 0 ]; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "自动合并上游 $TAG 出现无既定策略的冲突路径，需要人工处理。\n\n运行日志：$RUN_URL"

      - name: Notify failure (non-conflict)
        if: failure() && steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="sync: 自动同步 $TAG 失败（非冲突）"
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'length' || echo 0)
          if [ "$COUNT" -gt 0 ]; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "同步流水线在质量门禁或推送环节失败。\n\n运行日志：$RUN_URL"

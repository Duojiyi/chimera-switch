name: Sync upstream

# 上游 cc-switch（farion1231/cc-switch）发布稳定版后，由维护者手动同步去广告版。
# prepare job 只处理公开上游代码，publish job 才能接触 SYNC_TOKEN；两者之间只传
# git bundle 和不可执行的元数据。同步完成后由维护者手动运行 release 和 promote-release。

run-name: Sync upstream / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and test upstream candidate
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      skip: ${{ steps.check.outputs.skip }}
      recovery: ${{ steps.check.outputs.recovery }}
      tag_recovery: ${{ steps.check.outputs.tag_recovery }}
      recovery_pr_number: ${{ steps.check.outputs.recovery_pr_number }}
      recovery_branch: ${{ steps.check.outputs.recovery_branch }}
      recovery_head_sha: ${{ steps.check.outputs.recovery_head_sha }}
      recovery_base_sha: ${{ steps.check.outputs.recovery_base_sha }}
      recovery_candidate_sha: ${{ steps.check.outputs.recovery_candidate_sha }}
      recovery_ci_run_id: ${{ steps.check.outputs.recovery_ci_run_id }}
      recovery_ci_run_attempt: ${{ steps.check.outputs.recovery_ci_run_attempt }}
      release_required: ${{ steps.check.outputs.release_required }}
      candidate_artifact_id: ${{ steps.upload-candidate.outputs.artifact-id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Add and fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream --tags --prune --force
          git fetch origin --no-tags refs/heads/main

      - name: Record protected main base
        id: base
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse refs/remotes/origin/main)
          printf '%s' "$base_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not resolve immutable main base SHA"; exit 1; }
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Detect latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/farion1231/cc-switch/releases/latest)
          TAG=$(printf '%s' "$release" | jq -r '.tag_name // empty')
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest upstream release has no valid stable tag (received: $TAG)"
            exit 1
          fi
          if [ "$(printf '%s' "$release" | jq -r '.draft')" != false ] || [ "$(printf '%s' "$release" | jq -r '.prerelease')" != false ]; then
            echo "::error::Upstream latest release $TAG is draft/prerelease; refusing automatic sync."
            exit 1
          fi
          UPSTREAM_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! printf '%s' "$UPSTREAM_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve immutable upstream commit for $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable release: $TAG ($UPSTREAM_SHA)"

      - name: Setup Node.js for release contract checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Check existing tag and release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo 'recovery=false' >> "$GITHUB_OUTPUT"
          echo 'tag_recovery=false' >> "$GITHUB_OUTPUT"
          echo 'release_required=false' >> "$GITHUB_OUTPUT"
          origin_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -z "$origin_refs" ]; then
            # A sync PR may already have been reviewed and squash-merged before
            # the original run reached tag creation. Recover only that exact
            # state; otherwise the normal candidate flow must prepare a new PR.
            recovery_branch="automation/upstream-sync-$TAG"
            recovery_prs=$(gh pr list --repo "$REPOSITORY" --head "$recovery_branch" --base main --state merged \
              --json number,title,headRefName,headRefOid,headRepository,baseRefName,baseRefOid,mergeCommit)
            if [ "$(printf '%s' "$recovery_prs" | jq 'length')" -ne 1 ]; then
              echo "Tag $TAG is not on origin; a normal upstream sync is required."
              exit 0
            fi
            recovery_pr=$(printf '%s' "$recovery_prs" | jq -c '.[0]')
            recovery_pr_number=$(printf '%s' "$recovery_pr" | jq -r .number)
            recovery_head_sha=$(printf '%s' "$recovery_pr" | jq -r .headRefOid)
            recovery_base_sha=$(printf '%s' "$recovery_pr" | jq -r .baseRefOid)
            recovery_merge_sha=$(printf '%s' "$recovery_pr" | jq -r '.mergeCommit.oid // empty')
            current_main=$(git rev-parse refs/remotes/origin/main)
            printf '%s\n' "$current_main" "$recovery_head_sha" "$recovery_base_sha" "$recovery_merge_sha" \
              | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Merged sync PR contains an invalid immutable SHA"; exit 1; }
            printf '%s' "$recovery_pr" | jq -e \
              --arg repo "$REPOSITORY" \
              --arg title "sync: merge upstream $TAG" \
              --arg branch "$recovery_branch" \
              '.title == $title
              and .headRefName == $branch
              and .headRepository.nameWithOwner == $repo
              and .baseRefName == "main"' >/dev/null || {
                echo "::error::Merged sync PR identity does not match the expected protected sync PR"; exit 1;
            }
            git merge-base --is-ancestor "$recovery_merge_sha" "$current_main" || {
              echo "::error::Merged sync PR is not an ancestor of the current protected main"; exit 1;
            }
            merge_data=$(gh api "repos/$REPOSITORY/commits/$recovery_merge_sha")
            head_data=$(gh api "repos/$REPOSITORY/commits/$recovery_head_sha")
            printf '%s' "$merge_data" | jq -e \
              --arg base "$recovery_base_sha" \
              --arg merge "$recovery_merge_sha" \
              '.sha == $merge and (.parents | length) == 1 and .parents[0].sha == $base' >/dev/null || {
                echo "::error::Merged sync PR is not a squash commit based on its reviewed base"; exit 1;
              }
            recovery_head_tree=$(printf '%s' "$head_data" | jq -r '.commit.tree.sha')
            recovery_merge_tree=$(printf '%s' "$merge_data" | jq -r '.commit.tree.sha')
            [ "$recovery_head_tree" = "$recovery_merge_tree" ] || {
              echo "::error::Merged sync PR tree differs from its reviewed head tree"; exit 1;
            }

            # Require a completed CI run for this exact PR head and its CI Gate.
            ci_runs=$(gh api --paginate \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=100" --slurp \
              | jq -c --arg repo "$REPOSITORY" --arg branch "$recovery_branch" --arg head "$recovery_head_sha" \
                '[.[] | .workflow_runs[] | select(
                  .path == ".github/workflows/ci.yml"
                  and .event == "pull_request"
                  and .head_branch == $branch
                  and .head_sha == $head
                  and .repository.full_name == $repo
                  and .status == "completed"
                  and .conclusion == "success"
                )] | sort_by(.created_at, .id)')
            [ "$(printf '%s' "$ci_runs" | jq 'length')" -gt 0 ] || {
              echo "::error::No successful CI run found for the reviewed sync PR head"; exit 1;
            }
            recovery_ci_run_id=$(printf '%s' "$ci_runs" | jq -r 'last.id')
            recovery_ci_run_attempt=$(printf '%s' "$ci_runs" | jq -r 'last.run_attempt')
            recovery_ci_jobs=$(gh api --paginate \
              "repos/$REPOSITORY/actions/runs/$recovery_ci_run_id/attempts/$recovery_ci_run_attempt/jobs?per_page=100" --slurp \
              | jq '[.[] | .jobs[]]')
            printf '%s' "$recovery_ci_jobs" | jq -e --arg head "$recovery_head_sha" --argjson attempt "$recovery_ci_run_attempt" \
              '[.[] | select(
                .name == "CI Gate"
                and .workflow_name == "CI"
                and .head_sha == $head
                and .run_attempt == $attempt
                and .status == "completed"
                and .conclusion == "success"
              )] | length == 1' >/dev/null || {
                echo "::error::Reviewed sync PR does not have one successful CI Gate job"; exit 1;
              }
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            printf 'recovery=true\n' >> "$GITHUB_OUTPUT"
            printf 'tag_recovery=true\n' >> "$GITHUB_OUTPUT"
            printf 'release_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'recovery_pr_number=%s\n' "$recovery_pr_number" >> "$GITHUB_OUTPUT"
            printf 'recovery_branch=%s\n' "$recovery_branch" >> "$GITHUB_OUTPUT"
            printf 'recovery_head_sha=%s\n' "$recovery_head_sha" >> "$GITHUB_OUTPUT"
            printf 'recovery_base_sha=%s\n' "$recovery_base_sha" >> "$GITHUB_OUTPUT"
            printf 'recovery_candidate_sha=%s\n' "$recovery_merge_sha" >> "$GITHUB_OUTPUT"
            printf 'recovery_ci_run_id=%s\n' "$recovery_ci_run_id" >> "$GITHUB_OUTPUT"
            printf 'recovery_ci_run_attempt=%s\n' "$recovery_ci_run_attempt" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is missing but merged sync PR #$recovery_pr_number is eligible for protected tag recovery."
            exit 0
          fi

          origin_tag_object_sha=$(printf '%s\n' "$origin_refs" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1; exit}')
          origin_tag_sha=$(printf '%s\n' "$origin_refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1; exit}')
          if [ -z "$origin_tag_sha" ]; then
            origin_tag_sha="$origin_tag_object_sha"
          fi
          printf '%s' "$origin_tag_object_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not resolve immutable origin tag object for $TAG"; exit 1; }
          printf '%s' "$origin_tag_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not resolve immutable origin commit for $TAG"; exit 1; }
          if ! git cat-file -e "$origin_tag_object_sha" 2>/dev/null || ! git cat-file -e "$origin_tag_sha^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags origin "refs/tags/$TAG:refs/tags/chimera-sync-validation/$TAG"
          fi
          tag_provenance=""
          provenance_status=0
          tag_provenance=$(node scripts/validate-sync-tag.mjs "$TAG" "$UPSTREAM_SHA" "$origin_tag_object_sha" "$origin_tag_sha" origin/main) || provenance_status=$?
          if [ "$provenance_status" -eq 3 ]; then
            # Tags pushed before the provenance scheme carry only "Release <tag>"
            # and can never gain a record retroactively. Rebuild the same fields
            # from the merged sync PR so every check below stays identical, and
            # let validate-sync-tag.mjs re-apply the git-structural rules to the
            # rebuilt record. Only the upstream-commit binding is weaker here: it
            # rests on the sync PR title rather than on the signed tag body.
            echo "::notice::Release tag $TAG predates sync provenance; rebuilding its record from the merged sync PR."
            legacy_branch="automation/upstream-sync-$TAG"
            legacy_prs=$(gh pr list --repo "$REPOSITORY" --head "$legacy_branch" --base main --state merged \
              --json number,title,headRefOid,headRepository,baseRefName,baseRefOid,mergeCommit)
            [ "$(printf '%s' "$legacy_prs" | jq 'length')" -eq 1 ] || {
              echo "::error::Expected exactly one merged sync PR on $legacy_branch for $TAG"; exit 1;
            }
            legacy_pr=$(printf '%s' "$legacy_prs" | jq -c '.[0]')
            printf '%s' "$legacy_pr" | jq -e \
              --arg repo "$REPOSITORY" \
              --arg title "sync: merge upstream $TAG" \
              --arg merged "$origin_tag_sha" '
              .title == $title
              and .headRepository.nameWithOwner == $repo
              and .baseRefName == "main"
              and .mergeCommit.oid == $merged' >/dev/null || {
                echo "::error::Merged sync PR for $TAG is not the reviewed merge behind the origin tag"; exit 1;
              }
            legacy_candidate_sha=$(printf '%s' "$legacy_pr" | jq -r .headRefOid)
            legacy_base_sha=$(printf '%s' "$legacy_pr" | jq -r .baseRefOid)
            legacy_candidate_tree=$(gh api "repos/$REPOSITORY/commits/$legacy_candidate_sha" --jq .commit.tree.sha)
            legacy_merged_tree=$(gh api "repos/$REPOSITORY/commits/$origin_tag_sha" --jq .commit.tree.sha)
            # Bind the rebuilt record to exactly one sync run that actually
            # published this candidate, using the same evidence the run checks
            # below re-verify.
            legacy_run_id=""
            legacy_run_attempt=""
            while IFS=' ' read -r candidate_run_id candidate_run_attempt; do
              candidate_jobs=$(gh api --paginate \
                "repos/$REPOSITORY/actions/runs/$candidate_run_id/attempts/$candidate_run_attempt/jobs?per_page=100" --slurp \
                | jq '[.[] | .jobs[]]')
              printf '%s' "$candidate_jobs" | jq -e --argjson attempt "$candidate_run_attempt" '
                [.[] | select(
                  .name == "Publish verified candidate"
                  and .run_attempt == $attempt
                  and .status == "completed"
                  and ([.steps[]? | select(
                    .name == "Push candidate and create protected sync PR"
                    and .status == "completed"
                    and .conclusion == "success"
                  )] | length == 1)
                )] | length == 1' >/dev/null || continue
              [ -z "$legacy_run_id" ] || { echo "::error::Multiple sync runs published a candidate for $TAG"; exit 1; }
              legacy_run_id="$candidate_run_id"
              legacy_run_attempt="$candidate_run_attempt"
            done < <(gh api --paginate \
              "repos/$REPOSITORY/actions/workflows/sync-upstream.yml/runs?branch=main&head_sha=$legacy_base_sha&per_page=100" --slurp \
              | jq -r '[.[] | .workflow_runs[]] | .[] | "\(.id) \(.run_attempt)"')
            [ -n "$legacy_run_id" ] || { echo "::error::No sync run published the reviewed candidate for $TAG"; exit 1; }
            jq -n \
              --arg tag "$TAG" \
              --arg upstream_sha "$UPSTREAM_SHA" \
              --arg base_sha "$legacy_base_sha" \
              --arg candidate_sha "$legacy_candidate_sha" \
              --arg candidate_tree "$legacy_candidate_tree" \
              --arg merged_sha "$origin_tag_sha" \
              --arg merged_tree "$legacy_merged_tree" \
              --argjson sync_pr_number "$(printf '%s' "$legacy_pr" | jq .number)" \
              --argjson sync_run_id "$legacy_run_id" \
              --argjson sync_run_attempt "$legacy_run_attempt" \
              '{schemaVersion: 1, tag: $tag, upstreamSha: $upstream_sha, baseSha: $base_sha, candidateSha: $candidate_sha, candidateTree: $candidate_tree, mergedSha: $merged_sha, mergedTree: $merged_tree, syncPrNumber: $sync_pr_number, syncRunId: $sync_run_id, syncRunAttempt: $sync_run_attempt}' \
              > "$RUNNER_TEMP/rebuilt-sync-record.json"
            tag_provenance=$(node scripts/validate-sync-tag.mjs "--legacy-record=$RUNNER_TEMP/rebuilt-sync-record.json" "$TAG" "$UPSTREAM_SHA" "$origin_tag_object_sha" "$origin_tag_sha" origin/main)
          elif [ "$provenance_status" -ne 0 ]; then
            echo "::error::Could not validate the origin release tag provenance for $TAG"
            exit 1
          fi
          sync_pr_number=$(printf '%s' "$tag_provenance" | jq -r '.syncPrNumber // empty')
          sync_pr_data=$(gh pr view "$sync_pr_number" --repo "$REPOSITORY" --json state,title,headRefName,headRefOid,headRepository,baseRefName,baseRefOid,mergeCommit)
          sync_pr_head_sha=$(printf '%s' "$sync_pr_data" | jq -r .headRefOid)
          sync_pr_base_sha=$(printf '%s' "$tag_provenance" | jq -r .baseSha)
          sync_pr_candidate_sha=$(printf '%s' "$tag_provenance" | jq -r .candidateSha)
          printf '%s' "$sync_pr_data" | jq -e \
            --arg repo "$REPOSITORY" \
            --arg title "sync: merge upstream $TAG" \
            --arg branch "automation/upstream-sync-$TAG" \
            --arg base "$sync_pr_base_sha" \
            --arg merged "$origin_tag_sha" \
            '.state == "MERGED"
            and .title == $title
            and .headRefName == $branch
            and .headRepository.nameWithOwner == $repo
            and .baseRefName == "main"
            and .baseRefOid == $base
            and .mergeCommit.oid == $merged' >/dev/null || {
              echo "::error::Sync provenance PR does not match the reviewed merge"; exit 1;
            }
          if [ "$sync_pr_head_sha" != "$sync_pr_candidate_sha" ]; then
            # Tag recovery records the already merged commit as candidateSha.
            # Accept it only when the reviewed PR head has the exact same tree.
            [ "$sync_pr_candidate_sha" = "$origin_tag_sha" ] || { echo "::error::Sync provenance candidate is not the tag target"; exit 1; }
            sync_pr_head_tree=$(gh api "repos/$REPOSITORY/commits/$sync_pr_head_sha" --jq .commit.tree.sha)
            sync_pr_candidate_tree=$(gh api "repos/$REPOSITORY/commits/$sync_pr_candidate_sha" --jq .commit.tree.sha)
            [ "$sync_pr_head_tree" = "$sync_pr_candidate_tree" ] || { echo "::error::Recovered sync PR head tree differs from the tagged merge"; exit 1; }
          fi
          candidate_data=$(gh api "repos/$REPOSITORY/commits/$sync_pr_candidate_sha")
          printf '%s' "$candidate_data" | jq -e \
            --arg candidate "$(printf '%s' "$tag_provenance" | jq -r .candidateSha)" \
            --arg base "$(printf '%s' "$tag_provenance" | jq -r .baseSha)" \
            --arg tree "$(printf '%s' "$tag_provenance" | jq -r .candidateTree)" \
            '.sha == $candidate
            and .commit.tree.sha == $tree
            and ([.parents[]?.sha] == [$base])' >/dev/null || {
              echo "::error::Sync provenance candidate commit does not match the reviewed tree"; exit 1;
            }
          sync_run_id=$(printf '%s' "$tag_provenance" | jq -r .syncRunId)
          sync_run_attempt=$(printf '%s' "$tag_provenance" | jq -r .syncRunAttempt)
          sync_run_data=$(gh api "repos/$REPOSITORY/actions/runs/$sync_run_id")
          sync_run_head=$(printf '%s' "$sync_run_data" | jq -r .head_sha)
          printf '%s' "$sync_run_head" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Sync provenance run has no immutable head SHA"; exit 1; }
          printf '%s' "$sync_run_data" | jq -e \
            --argjson attempt "$sync_run_attempt" \
            '.path == ".github/workflows/sync-upstream.yml"
            and .head_branch == "main"
            and .run_attempt == $attempt
            and (.event == "workflow_dispatch" or .event == "schedule")' >/dev/null || {
              echo "::error::Sync provenance run does not match the protected workflow"; exit 1;
            }
          if [ "$sync_pr_candidate_sha" = "$origin_tag_sha" ] && [ "$sync_pr_head_sha" != "$sync_pr_candidate_sha" ]; then
            # A tag-recovery run starts after the reviewed PR was merged and may
            # include later workflow fixes. Bind it between the tag target and
            # the current protected main instead of requiring either endpoint.
            git merge-base --is-ancestor "$origin_tag_sha" "$sync_run_head" || {
              echo "::error::Tag-recovery run predates the reviewed sync commit"; exit 1;
            }
            git merge-base --is-ancestor "$sync_run_head" origin/main || {
              echo "::error::Tag-recovery run is not on protected main history"; exit 1;
            }
          else
            sync_run_expected_head=$(printf '%s' "$tag_provenance" | jq -r .baseSha)
            [ "$sync_run_head" = "$sync_run_expected_head" ] || {
              echo "::error::Sync provenance run does not match the reviewed main base"; exit 1;
            }
          fi
          sync_run_jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$sync_run_id/attempts/$sync_run_attempt/jobs?per_page=100" --slurp \
            | jq '[.[] | .jobs[]]')
          printf '%s' "$sync_run_jobs" | jq -e \
            --argjson attempt "$sync_run_attempt" \
            '[.[] | select(
              .name == "Publish verified candidate"
              and .run_attempt == $attempt
              and .status == "completed"
              and ([.steps[]? | select(
                .name == "Push candidate and create protected sync PR"
                and .status == "completed"
                and .conclusion == "success"
              )] | length == 1)
            )] | length == 1' >/dev/null || {
              echo "::error::Sync provenance run did not complete the verified candidate publication step"; exit 1;
            }

          matches=$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp \
            | jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(printf '%s' "$matches" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "Release $TAG is missing; secure recovery will assemble a bot-owned draft."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'recovery=true' >> "$GITHUB_OUTPUT"
            echo 'release_required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$count" -eq 1 ] || { echo "::error::Multiple releases unexpectedly match $TAG"; exit 1; }
          release_data=$(printf '%s' "$matches" | jq -c '.[0]')
          printf '%s' "$release_data" | jq -e '(.draft | type) == "boolean" and (.prerelease | type) == "boolean" and (.assets | type) == "array"' >/dev/null || {
            echo "::error::Release $TAG returned malformed metadata"; exit 1;
          }

          printf '%s' "$release_data" | jq '[.assets[] | {name,id,size,digest,state}] | sort_by(.name)' > release-asset-snapshot.json
          complete=false
          if node scripts/validate-release-asset-snapshot.mjs release-asset-snapshot.json "$TAG"; then
            complete=true
          else
            echo "Release $TAG does not yet satisfy the exact immutable 29-asset contract."
          fi

          is_draft=$(printf '%s' "$release_data" | jq -r .draft)
          is_prerelease=$(printf '%s' "$release_data" | jq -r .prerelease)
          if [ "$is_prerelease" = true ]; then
            echo "::error::Legacy prerelease $TAG is unsupported; migrate it to the reviewed draft state before retrying"
            exit 1
          fi
          if [ "$is_draft" = false ]; then
            [ "$complete" = true ] || { echo "::error::Stable release $TAG is incomplete; refusing mutation"; exit 1; }
            [ "$(printf '%s' "$release_data" | jq -r '.immutable // false')" = true ] || {
              echo "::error::Stable release $TAG is not protected by GitHub immutable releases"; exit 1;
            }
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Release $TAG is complete, immutable, and stable; nothing to do."
            exit 0
          fi

          marker='<!-- chimera-automated-release-draft:v1 -->'
          expected_title="Chimera Switch $TAG"
          printf '%s' "$release_data" | jq -e --arg sha "$origin_tag_sha" --arg title "$expected_title" --arg marker "$marker" '
            .draft == true
            and .prerelease == false

            and .name == $title
            and .author.login == "github-actions[bot]"
            and (.body | contains($marker))
          ' >/dev/null || { echo "::error::Existing draft is not the expected bot-owned automated draft"; exit 1; }
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo 'recovery=true' >> "$GITHUB_OUTPUT"
          if [ "$complete" != true ]; then
            echo 'release_required=true' >> "$GITHUB_OUTPUT"
            echo "Bot-owned draft $TAG is incomplete; release.yml will reconcile and complete it."
          else
            echo "Bot-owned draft $TAG is complete; recovery can proceed directly to promotion."
          fi

      - name: Setup pnpm
        if: steps.check.outputs.skip != 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@10.12.3

      - name: Merge upstream with explicit conflict policy
        if: steps.check.outputs.skip != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA="${{ steps.base.outputs.base_sha }}"
          [ "$(git rev-parse HEAD)" = "$BASE_SHA" ] || { echo "::error::Checked-out HEAD is not the protected main base ($BASE_SHA)"; exit 1; }

          restore_trusted_paths() {
            # Remove untracked and ignored files too: a quality-gate command must
            # not be able to smuggle a new trusted script into the candidate.
            git clean -ffdx -- .github scripts
            git rm -r -q --ignore-unmatch .github scripts || true
            git checkout "$BASE_SHA" -- .github scripts
            git add .github scripts
            if ! git diff --cached --quiet -- .github scripts; then
              git commit --amend --no-edit
            fi
            git clean -ffdx -- .github scripts
          }

          if git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
            restore_trusted_paths
          else

          echo "上游合并出现冲突，按已知类别解决。"
          UNRESOLVED=0
          while IFS= read -r file; do
            has_ours=$(git ls-files -u -- "$file" | awk '$3 == 2' | wc -l)
            has_theirs=$(git ls-files -u -- "$file" | awk '$3 == 3' | wc -l)
            case "$file" in
              src-tauri/tauri.conf.json|src-tauri/Info.plist|src-tauri/icons/*|README.md|README_*.md|.github/*|scripts/*|assets/*|flatpak/*|deplink.html|CONTRIBUTING.md|SECURITY.md|SUPPORT.md|CODE_OF_CONDUCT.md|.gitignore|.gitattributes|LICENSE)
                if [ "$has_ours" -gt 0 ]; then git checkout --ours -- "$file" && git add -- "$file"; else git rm -q -f -- "$file"; fi ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|src-tauri/Cargo.toml|src-tauri/Cargo.lock|src/*|src-tauri/*|tests/*|docs/*|CHANGELOG.md|index.html|session-manager.md|*.config.*|tsconfig*.json|components.json|.node-version|rust-toolchain.toml)
                if [ "$has_ours" -eq 0 ] || [ "$has_theirs" -eq 0 ]; then git rm -q -f -- "$file"; else git checkout --theirs -- "$file" && git add -- "$file"; fi ;;
              *)
                echo "::error::No conflict policy exists for $file"
                UNRESOLVED=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=U)
          if [ "$UNRESOLVED" -ne 0 ]; then
            git merge --abort || true
            exit 1
          fi
          git commit --no-edit
          restore_trusted_paths
          fi

      - name: Re-debrand, align version, and run quality gates
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          restore_trusted_paths() {
            # Each Actions step starts a fresh shell, so repeat the restore here
            # before and after every command that can execute repository code.
            git clean -ffdx -- .github scripts
            git rm -r -q --ignore-unmatch .github scripts || true
            git checkout "$BASE_SHA" -- .github scripts
            git add .github scripts
            if ! git diff --cached --quiet -- .github scripts; then
              git commit --amend --no-edit
            fi
            git clean -ffdx -- .github scripts
          }
          node scripts/debrand.mjs
          node scripts/align-version.mjs "${TAG#v}"
          cargo fmt --manifest-path src-tauri/Cargo.toml
          # The conflict policy above resolves the root manifest and lockfile to
          # theirs, so a fork-only dependency in package.json disappears on every
          # upstream release and desynchronizes pnpm-lock.yaml. Report that cause
          # directly instead of failing later with ERR_PNPM_OUTDATED_LOCKFILE.
          # Fork tooling dependencies belong in a fork-owned nested package such
          # as scripts/workflow-contracts, whose contract suite runs in CI (this
          # gate restores .github and scripts from BASE_SHA, so those trusted
          # paths cannot change during a sync).
          node scripts/check-upstream-manifest.mjs "$UPSTREAM_SHA"
          # Install dependencies without executing scripts from the upstream tree.
          pnpm install --frozen-lockfile --ignore-scripts
          # Call fixed binaries directly. Do not execute scripts from the
          # upstream-controlled package.json during the trust-sensitive gate.
          pnpm exec prettier --write "src/**/*.{js,jsx,ts,tsx,css,json}"
          pnpm exec tsc --noEmit
          pnpm exec vitest run
          node scripts/check-debrand.mjs
          # The commands above run before this final restore, so their output
          # cannot modify the trusted workflow or script set.
          restore_trusted_paths
          git diff --exit-code -- .github scripts
          git diff --cached --exit-code -- .github scripts
          git add -A
          if git diff --cached --quiet; then
            echo "Quality gates made no tracked changes."
          else
            git commit -m "sync: merge upstream $TAG and re-apply debrand"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after quality gates; refusing to package an uncommitted candidate."
            git status --short
            exit 1
          fi

      - name: Package candidate bundle
        id: candidate
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$EXPECTED_BASE_SHA"
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Candidate base SHA is not an immutable commit"; exit 1; }
          remote_main_sha=$(git rev-parse origin/main)
          [ "$BASE_SHA" = "$remote_main_sha" ] || { echo "::error::Checked-out main is stale ($BASE_SHA != $remote_main_sha)"; exit 1; }
          upstream_refs=$(git ls-remote --tags upstream "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_upstream_sha=$(printf '%s\n' "$upstream_refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1; exit}')
          [ -n "$remote_upstream_sha" ] || remote_upstream_sha=$(printf '%s\n' "$upstream_refs" | awk 'NR == 1 {print $1}')
          [ "$remote_upstream_sha" = "$UPSTREAM_SHA" ] || { echo "::error::Upstream tag $TAG moved after fetch ($remote_upstream_sha != $UPSTREAM_SHA)"; exit 1; }
          # Preserve the exact tree that passed the quality gates, but discard
          # the untrusted upstream merge history before anything is handed to a
          # credentialed job. This also means a classic PAT with repo scope can
          # push the candidate because no workflow commit is introduced.
          TESTED_TREE=$(git rev-parse 'HEAD^{tree}')
          git reset --soft "$BASE_SHA"
          git commit -m "sync: merge upstream $TAG and re-apply debrand"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          [ "$CANDIDATE_SHA" != "$BASE_SHA" ] || { echo "::error::Upstream sync produced no candidate commit"; exit 1; }
          candidate_tree=$(git rev-parse "$CANDIDATE_SHA^{tree}")
          [ "$candidate_tree" = "$TESTED_TREE" ] || { echo "::error::Sanitized candidate tree differs from the tested tree"; exit 1; }
          candidate_parents=$(git show -s --format='%P' "$CANDIDATE_SHA")
          set -- $candidate_parents
          [ "$#" -eq 1 ] && [ "$1" = "$BASE_SHA" ] || { echo "::error::Candidate does not have protected main as its sole parent: $candidate_parents"; exit 1; }
          [ "$(git rev-list --count "$BASE_SHA..$CANDIDATE_SHA")" -eq 1 ] || { echo "::error::Candidate contains unexpected intermediate history"; exit 1; }
          git diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- .github scripts || { echo "::error::Sanitized candidate changes trusted workflow or script paths"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::Working tree changed while sanitizing the candidate"; exit 1; }
          git branch --force sync-candidate "$CANDIDATE_SHA"
          git bundle create "$RUNNER_TEMP/sync-candidate.bundle" sync-candidate --not "$BASE_SHA"
          jq -n \
            --arg tag "$TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            '{schemaVersion: 1, tag: $tag, upstreamSha: $upstream_sha, baseSha: $base_sha, candidateSha: $candidate_sha}' \
            > "$RUNNER_TEMP/sync-candidate.json"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload candidate bundle
        if: steps.check.outputs.skip != 'true'
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-sync-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sync-candidate.bundle
            ${{ runner.temp }}/sync-candidate.json
          if-no-files-found: error

  publish:
    name: Publish verified candidate
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.skip != 'true' || needs.prepare.outputs.recovery == 'true')
    runs-on: ubuntu-22.04
    environment: automation
    permissions:
      actions: read
      contents: read
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate sync token
        if: needs.prepare.outputs.recovery == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::SYNC_TOKEN is missing"; exit 1; }
          gh api "repos/$REPOSITORY" >/dev/null

      - name: Download candidate bundle
        if: needs.prepare.outputs.recovery != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate

      - name: Push candidate and create protected sync PR
        if: needs.prepare.outputs.recovery != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${SYNC_TOKEN:-}" ] || { echo "::error::SYNC_TOKEN is missing"; exit 1; }
          metadata=$(cat candidate/sync-candidate.json)
          if ! printf '%s' "$metadata" | jq -e 'type == "object" and .schemaVersion == 1 and (.tag | type) == "string" and (.upstreamSha | type) == "string" and (.baseSha | type) == "string" and (.candidateSha | type) == "string"' >/dev/null; then
            echo "::error::Candidate metadata does not match schemaVersion 1 object schema"
            exit 1
          fi
          for field in tag upstreamSha baseSha candidateSha; do
            value=$(printf '%s' "$metadata" | jq -r --arg field "$field" '.[$field]')
            [ -n "$value" ] || { echo "::error::Candidate metadata is missing $field"; exit 1; }
          done
          printf '%s\n' "$(printf '%s' "$metadata" | jq -r .tag)" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Candidate tag has invalid format"; exit 1; }
          for field in upstreamSha baseSha candidateSha; do
            printf '%s\n' "$(printf '%s' "$metadata" | jq -r --arg field "$field" '.[$field]')" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Candidate metadata field $field is not an immutable SHA"; exit 1; }
          done
          [ "$(printf '%s' "$metadata" | jq -r .tag)" = "$TAG" ] || { echo "::error::Candidate tag mismatch"; exit 1; }
          [ "$(printf '%s' "$metadata" | jq -r .upstreamSha)" = "$UPSTREAM_SHA" ] || { echo "::error::Candidate upstream SHA mismatch"; exit 1; }
          [ "$(printf '%s' "$metadata" | jq -r .baseSha)" = "$BASE_SHA" ] || { echo "::error::Candidate base SHA mismatch"; exit 1; }
          [ "$(printf '%s' "$metadata" | jq -r .candidateSha)" = "$CANDIDATE_SHA" ] || { echo "::error::Candidate commit SHA mismatch"; exit 1; }

          credential_file="$RUNNER_TEMP/sync-git-credentials"
          trap 'rm -f "$credential_file"' EXIT
          printf 'https://x-access-token:%s@github.com\n' "$SYNC_TOKEN" > "$credential_file"
          chmod 600 "$credential_file"
          git_auth() { git -c credential.helper= -c "credential.helper=store --file=$credential_file" "$@"; }

          push_root=$(mktemp -d)
          trap 'rm -rf "$push_root" "$credential_file"' EXIT
          push_repo="$push_root/repository"
          git init --quiet "$push_repo"
          git -C "$push_repo" config user.name "github-actions[bot]"
          git -C "$push_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$push_repo" remote add origin "https://github.com/$REPOSITORY.git"
          git_auth -C "$push_repo" fetch --quiet --no-tags origin refs/heads/main
          remote_main_sha=$(git -C "$push_repo" rev-parse FETCH_HEAD)
          [ "$remote_main_sha" = "$BASE_SHA" ] || { echo "::error::origin/main moved while preparing the candidate ($remote_main_sha != $BASE_SHA)"; exit 1; }

          bundle_path="$PWD/candidate/sync-candidate.bundle"
          git -C "$push_repo" fetch --quiet "$bundle_path" "refs/heads/sync-candidate:refs/remotes/bundle/candidate"
          git -C "$push_repo" cat-file -e "$CANDIDATE_SHA^{commit}"
          bundle_candidate_sha=$(git -C "$push_repo" rev-parse refs/remotes/bundle/candidate)
          [ "$bundle_candidate_sha" = "$CANDIDATE_SHA" ] || { echo "::error::Bundle ref does not match candidate metadata"; exit 1; }
          candidate_parents=$(git -C "$push_repo" show -s --format='%P' "$CANDIDATE_SHA")
          set -- $candidate_parents
          [ "$#" -eq 1 ] && [ "$1" = "$BASE_SHA" ] || { echo "::error::Candidate does not have protected main as its sole parent: $candidate_parents"; exit 1; }
          [ "$(git -C "$push_repo" rev-list --count "$BASE_SHA..$CANDIDATE_SHA")" -eq 1 ] || { echo "::error::Candidate bundle contains unexpected intermediate history"; exit 1; }
          git -C "$push_repo" diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- .github scripts || { echo "::error::Candidate changes trusted workflow or script paths"; exit 1; }

          branch_name="automation/upstream-sync-$TAG"
          remote_branch_sha=$(git_auth -C "$push_repo" ls-remote origin "refs/heads/$branch_name" | awk 'NR == 1 {print $1}')
          if [ -n "$remote_branch_sha" ] && [ "$remote_branch_sha" != "$CANDIDATE_SHA" ]; then
            echo "::error::Sync branch $branch_name already exists at a different commit; refusing to overwrite it."
            exit 1
          fi
          if [ -z "$remote_branch_sha" ]; then
            git -C "$push_repo" switch --quiet --create "$branch_name" "$CANDIDATE_SHA"
            git_auth -C "$push_repo" push --atomic origin "HEAD:refs/heads/$branch_name"
          fi

          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$branch_name" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            # gh pr create prints the PR URL, not its number, so read the number
            # back from the API instead of parsing that output.
            gh pr create --repo "$REPOSITORY" --base main --head "$branch_name" \
              --title "sync: merge upstream $TAG" \
              --body "Automated upstream sync for $TAG. The candidate was prepared and tested without write credentials. Run: $RUN_URL" >/dev/null
            pr_number=$(gh pr list --repo "$REPOSITORY" --head "$branch_name" --base main --state open --json number --jq '.[0].number // empty')
          fi
          # Fail here with the offending value rather than deep inside jq --argjson.
          case "$pr_number" in
            ''|*[!0-9]*|0*) echo "::error::Sync PR number is not numeric: '$pr_number'"; exit 1 ;;
          esac
          echo "Sync PR: #$pr_number"

          # GitHub 只是「尽力」填充 workflow_runs[].pull_requests，本仓库的同仓 PR 上
          # 它实测为空数组，因此不能把它当作硬性条件——否则下面的轮询会一直匹配不到
          # 而空转到超时。有值时仍要求精确匹配（多一层绑定），为空时退回到
          # path + event + head_branch + head_sha + repository + run_attempt 绑定：
          # PR 的 head/base SHA 由本循环内和合并前的 gh pr view 独立校验，合并本身
          # 还带 --match-head-commit，所以「合入的正是被测树」这一保证不受影响。
          api_repository="https://api.github.com/repos/$REPOSITORY"
          encoded_branch=$(jq -rn --arg value "$branch_name" '$value | @uri')
          ci_run_id=""
          ci_run_attempt=""
          for attempt in $(seq 1 180); do
            pr_data=$(gh pr view "$pr_number" --repo "$REPOSITORY" \
              --json state,headRefName,headRefOid,headRepository,baseRefName,baseRefOid,statusCheckRollup,mergeCommit)
            if [ "$(printf '%s' "$pr_data" | jq -r .state)" = CLOSED ]; then
              echo "::error::Sync PR #$pr_number was closed before CI completed."; exit 1
            fi
            [ "$(printf '%s' "$pr_data" | jq -r .headRefName)" = "$branch_name" ] || { echo "::error::PR head branch changed"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r .headRefOid)" = "$CANDIDATE_SHA" ] || { echo "::error::PR head SHA changed from the tested candidate"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r '.headRepository.nameWithOwner // empty')" = "$REPOSITORY" ] || { echo "::error::PR head repository is not this repository"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r .baseRefName)" = main ] || { echo "::error::PR base branch changed"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r .baseRefOid)" = "$BASE_SHA" ] || { echo "::error::PR base SHA changed from the tested base"; exit 1; }
            failed_checks=$(printf '%s' "$pr_data" | jq '[.statusCheckRollup[]? | ((.conclusion // .state // "") | ascii_upcase) | select(IN("FAILURE", "ERROR", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"))] | length')
            [ "$failed_checks" -eq 0 ] || { echo "::error::Sync PR #$pr_number has a failed status check"; exit 1; }

            run_pages=$(gh api --paginate "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&branch=$encoded_branch&per_page=100" --slurp)
            matching_runs=$(printf '%s' "$run_pages" | jq -c \
              --arg repo "$REPOSITORY" \
              --arg api_repo "$api_repository" \
              --arg branch "$branch_name" \
              --arg head "$CANDIDATE_SHA" \
              --arg base "$BASE_SHA" \
              --argjson pr "$pr_number" '
                [.[] | .workflow_runs[]
                  | select(
                    .path == ".github/workflows/ci.yml"
                    and .event == "pull_request"
                    and .head_branch == $branch
                    and .head_sha == $head
                    and .repository.full_name == $repo
                    and (
                      (.pull_requests | length) == 0
                      or ([.pull_requests[]
                        | select(
                          .number == $pr
                          and .head.ref == $branch
                          and .head.sha == $head
                          and .head.repo.url == $api_repo
                          and .base.ref == "main"
                          and .base.sha == $base
                          and .base.repo.url == $api_repo
                        )] | length) == 1
                    )
                  )]
                | sort_by(.created_at, .id)')
            if [ "$(printf '%s' "$matching_runs" | jq 'length')" -gt 0 ]; then
              ci_run=$(printf '%s' "$matching_runs" | jq -c 'last')
              ci_run_id=$(printf '%s' "$ci_run" | jq -r '.id // empty')
              ci_run_attempt=$(printf '%s' "$ci_run" | jq -r '.run_attempt // empty')
              printf '%s' "$ci_run_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::CI workflow returned an invalid run id"; exit 1; }
              printf '%s' "$ci_run_attempt" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::CI workflow returned an invalid run attempt"; exit 1; }
              ci_status=$(printf '%s' "$ci_run" | jq -r .status)
              ci_conclusion=$(printf '%s' "$ci_run" | jq -r '.conclusion // empty')
              if [ "$ci_status" = completed ]; then
                [ "$ci_conclusion" = success ] || { echo "::error::Exact CI workflow run $ci_run_id attempt $ci_run_attempt concluded $ci_conclusion"; exit 1; }
                ci_jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_run_attempt/jobs?per_page=100" --slurp \
                  | jq '[.[] | .jobs[]]')
                printf '%s' "$ci_jobs" | jq -e --arg head "$CANDIDATE_SHA" --argjson attempt "$ci_run_attempt" '
                  [.[] | select(
                    .name == "CI Gate"
                    and .workflow_name == "CI"
                    and .head_sha == $head
                    and .run_attempt == $attempt
                    and .status == "completed"
                    and .conclusion == "success"
                  )] | length == 1
                ' >/dev/null || { echo "::error::Exact CI run does not contain one successful CI Gate job"; exit 1; }
                break
              fi
            fi
            [ "$attempt" -lt 180 ] || { echo "::error::Exact pull_request CI workflow did not pass within the timeout"; exit 1; }
            sleep 30
          done

          current_main=$(git_auth -C "$push_repo" ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')
          [ "$current_main" = "$BASE_SHA" ] || { echo "::error::main changed while CI was running; refusing to merge a stale candidate"; exit 1; }
          pr_data=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json state,headRefName,headRefOid,headRepository,baseRefName,baseRefOid)
          [ "$(printf '%s' "$pr_data" | jq -r .state)" = OPEN ] || { echo "::error::PR is no longer open"; exit 1; }
          [ "$(printf '%s' "$pr_data" | jq -r .headRefName)" = "$branch_name" ] || { echo "::error::PR head branch changed before merge"; exit 1; }
          [ "$(printf '%s' "$pr_data" | jq -r .headRefOid)" = "$CANDIDATE_SHA" ] || { echo "::error::PR head changed before merge"; exit 1; }
          [ "$(printf '%s' "$pr_data" | jq -r '.headRepository.nameWithOwner // empty')" = "$REPOSITORY" ] || { echo "::error::PR head repository changed before merge"; exit 1; }
          [ "$(printf '%s' "$pr_data" | jq -r .baseRefName)" = main ] || { echo "::error::PR base branch changed before merge"; exit 1; }
          [ "$(printf '%s' "$pr_data" | jq -r .baseRefOid)" = "$BASE_SHA" ] || { echo "::error::PR base SHA changed before merge"; exit 1; }

          final_ci_run=$(gh api "repos/$REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_run_attempt")
          printf '%s' "$final_ci_run" | jq -e \
            --arg repo "$REPOSITORY" \
            --arg api_repo "$api_repository" \
            --arg branch "$branch_name" \
            --arg head "$CANDIDATE_SHA" \
            --arg base "$BASE_SHA" \
            --argjson pr "$pr_number" \
            --argjson attempt "$ci_run_attempt" '
              .path == ".github/workflows/ci.yml"
              and .event == "pull_request"
              and .head_branch == $branch
              and .head_sha == $head
              and .repository.full_name == $repo
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"
              and (
                (.pull_requests | length) == 0
                or ([.pull_requests[]
                  | select(
                    .number == $pr
                    and .head.ref == $branch
                    and .head.sha == $head
                    and .head.repo.url == $api_repo
                    and .base.ref == "main"
                    and .base.sha == $base
                    and .base.repo.url == $api_repo
                  )] | length) == 1
              )
            ' >/dev/null || { echo "::error::Exact CI workflow run identity changed before merge"; exit 1; }
          final_ci_jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$ci_run_id/attempts/$ci_run_attempt/jobs?per_page=100" --slurp \
            | jq '[.[] | .jobs[]]')
          printf '%s' "$final_ci_jobs" | jq -e --arg head "$CANDIDATE_SHA" --argjson attempt "$ci_run_attempt" '
            [.[] | select(
              .name == "CI Gate"
              and .workflow_name == "CI"
              and .head_sha == $head
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"
            )] | length == 1
          ' >/dev/null || { echo "::error::CI Gate job identity changed before merge"; exit 1; }
          # Merge immediately with a head SHA lock. Auto-merge would introduce a
          # second race window in which the PR head or base could change after the
          # checks above have passed.
          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$CANDIDATE_SHA"

          merged_sha=""
          for attempt in $(seq 1 120); do
            pr_data=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json state,headRefName,headRefOid,headRepository,baseRefName,baseRefOid,statusCheckRollup,mergeCommit)
            state=$(printf '%s' "$pr_data" | jq -r .state)
            [ "$(printf '%s' "$pr_data" | jq -r .baseRefName)" = main ] || { echo "::error::PR base branch changed during merge"; exit 1; }
            if [ "$state" = MERGED ]; then
              merged_sha=$(printf '%s' "$pr_data" | jq -r '.mergeCommit.oid // empty')
              [ -n "$merged_sha" ] && break
            fi
            [ "$state" != CLOSED ] || { echo "::error::Sync PR #$pr_number closed without merging"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r .baseRefOid)" = "$BASE_SHA" ] || { echo "::error::PR base SHA changed during merge"; exit 1; }
            [ "$(printf '%s' "$pr_data" | jq -r .headRefOid)" = "$CANDIDATE_SHA" ] || { echo "::error::PR head changed during merge"; exit 1; }
            failed_checks=$(printf '%s' "$pr_data" | jq '[.statusCheckRollup[]? | ((.conclusion // .state // "") | ascii_upcase) | select(IN("FAILURE", "ERROR", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"))] | length')
            [ "$failed_checks" -eq 0 ] || { echo "::error::A required check failed while waiting for merge"; exit 1; }
            [ "$attempt" -lt 120 ] || { echo "::error::PR was not merged within the timeout"; exit 1; }
            sleep 30
          done
          printf '%s\n' "$merged_sha" | grep -Eq '^[0-9a-f]{40}$'

          git_auth -C "$push_repo" fetch --quiet --no-tags origin refs/heads/main:refs/remotes/origin/main
          remote_main_after_merge=$(git -C "$push_repo" rev-parse refs/remotes/origin/main)
          [ "$remote_main_after_merge" = "$merged_sha" ] || { echo "::error::main does not point at the PR merge commit ($remote_main_after_merge != $merged_sha)"; exit 1; }
          git_auth -C "$push_repo" fetch --quiet --no-tags origin "$merged_sha"
          git -C "$push_repo" cat-file -e "$merged_sha^{commit}"
          merged_parents=$(git -C "$push_repo" show -s --format='%P' "$merged_sha")
          set -- $merged_parents
          [ "$#" -eq 1 ] && [ "$1" = "$BASE_SHA" ] || { echo "::error::Squash merge has unexpected parent(s): $merged_parents"; exit 1; }
          candidate_tree=$(git -C "$push_repo" rev-parse "$CANDIDATE_SHA^{tree}")
          merged_tree=$(git -C "$push_repo" rev-parse "$merged_sha^{tree}")
          [ "$candidate_tree" = "$merged_tree" ] || { echo "::error::Merged tree differs from the tested candidate tree"; exit 1; }
          tag_refs=$(git_auth -C "$push_repo" ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_tag_sha=$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1; exit}')
          [ -z "$remote_tag_sha" ] && remote_tag_sha=$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1; exit}')
          if [ -n "$remote_tag_sha" ] && [ "$remote_tag_sha" != "$merged_sha" ]; then
            echo "::error::Tag $TAG already exists at $remote_tag_sha, not merged commit $merged_sha"; exit 1
          fi
          if [ -z "$remote_tag_sha" ]; then
            case "$GITHUB_RUN_ID" in
              ''|*[!0-9]*|0*) echo "::error::Sync run id is not numeric: '$GITHUB_RUN_ID'"; exit 1 ;;
            esac
            case "$GITHUB_RUN_ATTEMPT" in
              ''|*[!0-9]*|0*) echo "::error::Sync run attempt is not numeric: '$GITHUB_RUN_ATTEMPT'"; exit 1 ;;
            esac
            tag_tree=$(git -C "$push_repo" rev-parse "$merged_sha^{tree}")
            provenance_json=$(jq -cn \
              --arg tag "$TAG" \
              --arg upstream_sha "$UPSTREAM_SHA" \
              --arg base_sha "$BASE_SHA" \
              --arg candidate_sha "$CANDIDATE_SHA" \
              --arg candidate_tree "$candidate_tree" \
              --arg merged_sha "$merged_sha" \
              --arg merged_tree "$tag_tree" \
              --argjson sync_pr_number "$pr_number" \
              --argjson sync_run_id "$GITHUB_RUN_ID" \
              --argjson sync_run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{schemaVersion: 1, tag: $tag, upstreamSha: $upstream_sha, baseSha: $base_sha, candidateSha: $candidate_sha, candidateTree: $candidate_tree, mergedSha: $merged_sha, mergedTree: $merged_tree, syncPrNumber: $sync_pr_number, syncRunId: $sync_run_id, syncRunAttempt: $sync_run_attempt}')
            tag_message=$(printf 'Release %s\n\n%s\n%s' "$TAG" '<!-- chimera-sync-provenance:v1 -->' "$provenance_json")
            git -C "$push_repo" tag -a "$TAG" "$merged_sha" -m "$tag_message"
            git_auth -C "$push_repo" push --atomic origin "refs/tags/$TAG"
          fi

      - name: Push candidate and create protected sync PR
        if: needs.prepare.outputs.tag_recovery == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RECOVERY_PR_NUMBER: ${{ needs.prepare.outputs.recovery_pr_number }}
          RECOVERY_BRANCH: ${{ needs.prepare.outputs.recovery_branch }}
          RECOVERY_HEAD_SHA: ${{ needs.prepare.outputs.recovery_head_sha }}
          RECOVERY_BASE_SHA: ${{ needs.prepare.outputs.recovery_base_sha }}
          RECOVERY_CANDIDATE_SHA: ${{ needs.prepare.outputs.recovery_candidate_sha }}
          RECOVERY_CI_RUN_ID: ${{ needs.prepare.outputs.recovery_ci_run_id }}
          RECOVERY_CI_RUN_ATTEMPT: ${{ needs.prepare.outputs.recovery_ci_run_attempt }}
        run: |
          set -euo pipefail
          [ -n "${SYNC_TOKEN:-}" ] || { echo "::error::SYNC_TOKEN is missing"; exit 1; }
          for value in "$RECOVERY_PR_NUMBER" "$RECOVERY_HEAD_SHA" "$RECOVERY_BASE_SHA" "$RECOVERY_CANDIDATE_SHA" "$RECOVERY_CI_RUN_ID" "$RECOVERY_CI_RUN_ATTEMPT"; do
            [ -n "$value" ] || { echo "::error::Tag recovery metadata is incomplete"; exit 1; }
          done
          printf '%s\n' "$RECOVERY_HEAD_SHA" "$RECOVERY_BASE_SHA" "$RECOVERY_CANDIDATE_SHA" \
            | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Tag recovery contains an invalid SHA"; exit 1; }

          credential_file="$RUNNER_TEMP/sync-git-credentials"
          push_root=$(mktemp -d)
          trap 'rm -rf "$push_root" "$credential_file"' EXIT
          printf 'https://x-access-token:%s@github.com\n' "$SYNC_TOKEN" > "$credential_file"
          chmod 600 "$credential_file"
          git_auth() { git -c credential.helper= -c "credential.helper=store --file=$credential_file" "$@"; }
          push_repo="$push_root/repository"
          git init --quiet "$push_repo"
          git -C "$push_repo" config user.name "github-actions[bot]"
          git -C "$push_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$push_repo" remote add origin "https://github.com/$REPOSITORY.git"
          git_auth -C "$push_repo" fetch --quiet --no-tags origin refs/heads/main
          current_main=$(git -C "$push_repo" rev-parse FETCH_HEAD)
          git -C "$push_repo" merge-base --is-ancestor "$RECOVERY_CANDIDATE_SHA" "$current_main" || {
            echo "::error::Recovered sync commit is not an ancestor of the current protected main"; exit 1;
          }

          pr_data=$(gh pr view "$RECOVERY_PR_NUMBER" --repo "$REPOSITORY" \
            --json state,title,headRefName,headRefOid,headRepository,baseRefName,baseRefOid,mergeCommit)
          printf '%s' "$pr_data" | jq -e \
            --arg repo "$REPOSITORY" \
            --arg title "sync: merge upstream $TAG" \
            --arg branch "$RECOVERY_BRANCH" \
            --arg head "$RECOVERY_HEAD_SHA" \
            --arg base "$RECOVERY_BASE_SHA" \
            --arg merged "$RECOVERY_CANDIDATE_SHA" \
            '.state == "MERGED"
            and .title == $title
            and .headRefName == $branch
            and .headRefOid == $head
            and .headRepository.nameWithOwner == $repo
            and .baseRefName == "main"
            and .baseRefOid == $base
            and .mergeCommit.oid == $merged' >/dev/null || {
              echo "::error::Recovery PR identity changed"; exit 1;
            }
          merged_parents=$(git -C "$push_repo" show -s --format='%P' "$RECOVERY_CANDIDATE_SHA")
          set -- $merged_parents
          [ "$#" -eq 1 ] && [ "$1" = "$RECOVERY_BASE_SHA" ] || { echo "::error::Recovered merge is not a squash commit based on the reviewed PR base"; exit 1; }
          recovery_head_tree=$(gh api "repos/$REPOSITORY/commits/$RECOVERY_HEAD_SHA" --jq .commit.tree.sha)
          recovery_merged_tree=$(git -C "$push_repo" rev-parse "$RECOVERY_CANDIDATE_SHA^{tree}")
          [ "$recovery_head_tree" = "$recovery_merged_tree" ] || { echo "::error::Recovered merge tree differs from the reviewed PR head tree"; exit 1; }

          ci_run_data=$(gh api "repos/$REPOSITORY/actions/runs/$RECOVERY_CI_RUN_ID")
          printf '%s' "$ci_run_data" | jq -e \
            --arg repo "$REPOSITORY" \
            --arg branch "$RECOVERY_BRANCH" \
            --arg head "$RECOVERY_HEAD_SHA" \
            --argjson attempt "$RECOVERY_CI_RUN_ATTEMPT" \
            '.path == ".github/workflows/ci.yml"
            and .event == "pull_request"
            and .head_branch == $branch
            and .head_sha == $head
            and .repository.full_name == $repo
            and .run_attempt == $attempt
            and .status == "completed"
            and .conclusion == "success"' >/dev/null || { echo "::error::Recovery CI run identity changed"; exit 1; }
          ci_jobs=$(gh api --paginate \
            "repos/$REPOSITORY/actions/runs/$RECOVERY_CI_RUN_ID/attempts/$RECOVERY_CI_RUN_ATTEMPT/jobs?per_page=100" --slurp \
            | jq '[.[] | .jobs[]]')
          printf '%s' "$ci_jobs" | jq -e \
            --arg head "$RECOVERY_HEAD_SHA" \
            --argjson attempt "$RECOVERY_CI_RUN_ATTEMPT" \
            '[.[] | select(
              .name == "CI Gate"
              and .workflow_name == "CI"
              and .head_sha == $head
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"
            )] | length == 1' >/dev/null || { echo "::error::Recovery CI Gate is not successful"; exit 1; }

          tag_refs=$(git_auth -C "$push_repo" ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          [ -z "$tag_refs" ] || { echo "::error::Tag $TAG appeared while recovering; refusing to overwrite it"; exit 1; }
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*|0*) echo "::error::Sync run id is not numeric"; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*|0*) echo "::error::Sync run attempt is not numeric"; exit 1 ;; esac
          provenance_json=$(jq -cn \
            --arg tag "$TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg base_sha "$RECOVERY_BASE_SHA" \
            --arg candidate_sha "$RECOVERY_CANDIDATE_SHA" \
            --arg candidate_tree "$recovery_merged_tree" \
            --arg merged_sha "$RECOVERY_CANDIDATE_SHA" \
            --arg merged_tree "$recovery_merged_tree" \
            --argjson sync_pr_number "$RECOVERY_PR_NUMBER" \
            --argjson sync_run_id "$GITHUB_RUN_ID" \
            --argjson sync_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 1, tag: $tag, upstreamSha: $upstream_sha, baseSha: $base_sha, candidateSha: $candidate_sha, candidateTree: $candidate_tree, mergedSha: $merged_sha, mergedTree: $merged_tree, syncPrNumber: $sync_pr_number, syncRunId: $sync_run_id, syncRunAttempt: $sync_run_attempt}')
          tag_message=$(printf 'Release %s\n\n%s\n%s' "$TAG" '<!-- chimera-sync-provenance:v1 -->' "$provenance_json")
          git -C "$push_repo" tag -a "$TAG" "$RECOVERY_CANDIDATE_SHA" -m "$tag_message"
          git_auth -C "$push_repo" push --atomic origin "refs/tags/$TAG"
          echo "Protected recovery tag $TAG now points at $RECOVERY_CANDIDATE_SHA."

      - name: Hand off release and cloud publication to maintainer
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Sync completed for $TAG. No release or cloud publication was triggered automatically."
          echo "Next: manually run Release on main with tag $TAG, then Promote release on main with the same tag."

  notify:
    name: Notify synchronization failure
    needs: [prepare, publish]
    if: always() && (needs.prepare.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or reuse failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "GITHUB_TOKEN is missing; cannot create failure issue"; exit 0; }
          title="sync: 自动同步失败"
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length' || echo 0)
          [ "$count" -gt 0 ] && exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "自动同步流水线失败，需要检查运行日志和保护规则。\n\n运行日志：$RUN_URL"

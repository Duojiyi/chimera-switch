# Mirror immutable stable release assets to Cloudflare R2. The public mirror is
# untrusted by design: updater payloads remain protected by Minisign signatures.
# This workflow is reusable-only so provenance values cannot be supplied through
# an independent workflow_dispatch surface.
name: Sync release to R2

run-name: Sync R2 ${{ inputs.tag }} / request=${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      tag:
        description: 'Stable release tag to sync (e.g. v3.20.1)'
        required: true
        type: string
      request_id:
        description: 'Exact caller correlation id'
        required: true
        type: string
      source_sha:
        description: 'Immutable source commit resolved from the release tag'
        required: true
        type: string
      release_tooling_sha:
        description: 'Historical protected-main commit recorded by signed release provenance'
        required: true
        type: string
      verification_tooling_sha:
        description: 'Current protected-main commit whose verification scripts are executed'
        required: true
        type: string
      require_r2:
        description: 'Fail instead of skipping when R2 credentials are not configured'
        required: false
        default: true
        type: boolean
    secrets:
      R2_ACCOUNT_ID:
        description: 'Cloudflare account that owns the release bucket'
        required: false
      R2_ACCESS_KEY_ID:
        description: 'R2 S3-compatible access key id'
        required: false
      R2_SECRET_ACCESS_KEY:
        description: 'R2 S3-compatible secret access key'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: r2-release-sync
  cancel-in-progress: false

env:
  R2_BUCKET: chimera-switch-releases
  R2_PUBLIC_BASE_URL: https://dl.chimerahub.org
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  TAG: ${{ inputs.tag }}
  REQUEST_ID: ${{ inputs.request_id }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_TOOLING_SHA: ${{ inputs.release_tooling_sha }}
  VERIFICATION_TOOLING_SHA: ${{ inputs.verification_tooling_sha }}
  UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK

jobs:
  r2-credentials:
    name: Resolve R2 mirror availability
    runs-on: ubuntu-22.04
    environment: release
    outputs:
      configured: ${{ steps.resolve.outputs.configured }}
    steps:
      - name: Resolve complete R2 credential set
        id: resolve
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REQUIRE_R2: ${{ inputs.require_r2 }}
        run: |
          set -euo pipefail
          configured=0
          [ -n "$R2_ACCOUNT_ID" ] && configured=$((configured + 1))
          [ -n "$R2_ACCESS_KEY_ID" ] && configured=$((configured + 1))
          [ -n "$R2_SECRET_ACCESS_KEY" ] && configured=$((configured + 1))
          case "$configured" in
            3)
              echo 'configured=true' >> "$GITHUB_OUTPUT"
              echo 'A complete R2 credential set is configured; mirror synchronization will run.'
              ;;
            0)
              echo 'configured=false' >> "$GITHUB_OUTPUT"
              if [ "$REQUIRE_R2" = true ]; then
                echo '::error::R2 repair requires R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY'
                exit 1
              fi
              echo '::notice::R2 credentials are not configured; the GitHub release remains authoritative and mirror synchronization is skipped'
              ;;
            *)
              echo '::error::R2 credentials are partially configured; configure all three values or remove all three'
              exit 1
              ;;
          esac

  sync-to-r2:
    name: Verify and mirror immutable release
    needs: r2-credentials
    if: needs.r2-credentials.outputs.configured == 'true'
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Validate caller and immutable release contract
        id: contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::R2 synchronization must run from protected main"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag must match vX.Y.Z"; exit 1; }
          printf '%s' "$REQUEST_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' || { echo "::error::Invalid request_id"; exit 1; }
          for value in "$SOURCE_SHA" "$RELEASE_TOOLING_SHA" "$VERIFICATION_TOOLING_SHA"; do
            printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::All provenance SHAs must be immutable 40-character commits"; exit 1; }
          done

          main_sha=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk 'NR == 1 {print $1}')
          [ "$main_sha" = "$RUN_SHA" ] && [ "$main_sha" = "$VERIFICATION_TOOLING_SHA" ] || {
            echo "::error::Current protected main is not the caller-bound verification tooling SHA"
            exit 1
          }
          refs=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_source=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$TAG"'^{}" {print $1; exit}')
          [ -n "$remote_source" ] || remote_source=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          [ "$remote_source" = "$SOURCE_SHA" ] || { echo "::error::Tag $TAG does not resolve to caller-bound source $SOURCE_SHA"; exit 1; }
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_TOOLING_SHA...$VERIFICATION_TOOLING_SHA" --jq .status)
          case "$comparison" in
            ahead|identical) ;;
            *) echo "::error::Historical release tooling is not an ancestor of current protected main ($comparison)"; exit 1 ;;
          esac

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          release_id=$(printf '%s' "$release" | jq -r '.id // empty')
          printf '%s' "$release_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Release returned an invalid id"; exit 1; }
          printf '%s' "$release" | jq -e --argjson id "$release_id" --arg tag "$TAG" '
            .id == $id and .tag_name == $tag
            and .draft == false and .prerelease == false
            and .immutable == true and (.published_at != null)
          ' >/dev/null || {
            echo "::error::$TAG is not the expected immutable stable release bound to the verified tag"; exit 1;
          }
          printf 'release_id=%s\npublished_at=%s\n' "$release_id" "$(printf '%s' "$release" | jq -r .published_at)" >> "$GITHUB_OUTPUT"

      - name: Checkout current protected verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.verification_tooling_sha }}
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download exact stable assets and verify historical provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.contract.outputs.release_id }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_ID" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid release id"; exit 1; }
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          printf '%s' "$release" | jq -e --argjson id "$RELEASE_ID" --arg tag "$TAG" '
            .id == $id and .tag_name == $tag
            and .draft == false and .prerelease == false
            and .immutable == true and (.published_at != null)
          ' >/dev/null || { echo "::error::Release left immutable stable state"; exit 1; }
          printf '%s' "$release" | jq '[.assets[] | {name,id,size,digest,state}] | sort_by(.name)' > release-asset-snapshot.json
          node .release-scripts/scripts/validate-release-asset-snapshot.mjs release-asset-snapshot.json "$TAG"
          rm -rf r2-assets
          mkdir -p r2-assets
          while IFS=$'\t' read -r asset_id name; do
            printf '%s' "$asset_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid release asset id"; exit 1; }
            printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$' || { echo "::error::Unsafe release asset name: $name"; exit 1; }
            [ ! -e "r2-assets/$name" ] || { echo "::error::Duplicate release asset name: $name"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "r2-assets/$name"
            [ -s "r2-assets/$name" ] || { echo "::error::Empty release asset: $name"; exit 1; }
          done < <(printf '%s' "$release" | jq -r '.assets[] | [.id,.name] | @tsv')
          node .release-scripts/scripts/validate-release-asset-snapshot.mjs release-asset-snapshot.json "$TAG" r2-assets

          node .release-scripts/scripts/verify-release-assets.mjs r2-assets "$TAG" "$GITHUB_REPOSITORY" r2-assets/latest.json "$UPDATER_PUBLIC_KEY" \
            --require-user-assets --expected-source-sha="$SOURCE_SHA" --expected-tooling-sha="$RELEASE_TOOLING_SHA"
          workflow_run_id=$(jq -r .workflowRunId r2-assets/provenance.json)
          workflow_run_attempt=$(jq -r '.workflowRunAttempt // empty' r2-assets/provenance.json)
          printf '%s' "$workflow_run_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid release workflow run id"; exit 1; }
          printf '%s' "$workflow_run_attempt" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid release workflow run attempt"; exit 1; }
          run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$workflow_run_id")
          printf '%s' "$run_info" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$RELEASE_TOOLING_SHA" --argjson attempt "$workflow_run_attempt" '
            .path == ".github/workflows/release.yml"
            and (.event == "workflow_dispatch" or .event == "repository_dispatch")
            and .head_branch == "main"
            and .head_sha == $sha
            and .repository.full_name == $repo
            and .run_attempt == $attempt
            and .conclusion == "success"
          ' >/dev/null || { echo "::error::Release provenance is not bound to a successful protected release run"; exit 1; }

          # The immutable GitHub Release attestation is an independent integrity
          # layer over the release-wide snapshot and every downloaded asset.
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || {
            echo "::error::GitHub immutable release attestation verification failed"; exit 1;
          }
          while IFS= read -r file; do
            gh release verify-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY" >/dev/null || {
              echo "::error::GitHub release attestation failed for $(basename "$file")"; exit 1;
            }
          done < <(find r2-assets -maxdepth 1 -type f -print | sort)

          final_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          printf '%s' "$final_release" | jq -e --argjson id "$RELEASE_ID" --arg tag "$TAG" '
            .id == $id and .tag_name == $tag
            and .draft == false and .prerelease == false
            and .immutable == true and (.published_at != null)
          ' >/dev/null || { echo "::error::Release state changed during mirror verification"; exit 1; }
          printf '%s' "$final_release" | jq '[.assets[] | {name,id,size,digest,state}] | sort_by(.name)' > release-asset-snapshot-final.json
          node .release-scripts/scripts/validate-release-asset-snapshot.mjs release-asset-snapshot-final.json "$TAG"
          cmp -s release-asset-snapshot.json release-asset-snapshot-final.json || { echo "::error::Immutable release asset snapshot changed"; exit 1; }

      - name: Build deterministic versioned manifests and generation record
        env:
          PUBLISHED_AT: ${{ steps.contract.outputs.published_at }}
        run: |
          set -euo pipefail
          node .release-scripts/scripts/generate-download-manifest.mjs r2-assets "$TAG" "$R2_PUBLIC_BASE_URL" r2-assets/manifest.json "$PUBLISHED_AT"
          node .release-scripts/scripts/rewrite-updater-manifest.mjs r2-assets/latest.json "$TAG" "$GITHUB_REPOSITORY" "$R2_PUBLIC_BASE_URL" r2-assets/latest-r2.json
          manifest_sha=$(sha256sum r2-assets/manifest.json | awk '{print $1}')
          updater_sha=$(sha256sum r2-assets/latest-r2.json | awk '{print $1}')
          jq -nS \
            --arg tag "$TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg releaseToolingSha "$RELEASE_TOOLING_SHA" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg manifestKey "$TAG/manifest.json" \
            --arg manifestSha "$manifest_sha" \
            --arg updaterKey "$TAG/latest-r2.json" \
            --arg updaterSha "$updater_sha" \
            '{
              schemaVersion: 1,
              tag: $tag,
              sourceSha: $sourceSha,
              releaseToolingSha: $releaseToolingSha,
              publishedAt: $publishedAt,
              objects: {
                downloadManifest: {key: $manifestKey, sha256: $manifestSha},
                updaterManifest: {key: $updaterKey, sha256: $updaterSha}
              }
            }' > r2-assets/generation.json
      - name: Check whether this is still the latest stable release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          printf 'latest_tag=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$TAG" ]; then
            echo 'is_latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_latest=false' >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is no longer latest ($latest); only immutable versioned objects will be written."
          fi

      - name: Upload write-once versioned objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          refs=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_source=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$TAG"'^{}" {print $1; exit}')
          [ -n "$remote_source" ] || remote_source=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          [ "$remote_source" = "$SOURCE_SHA" ] || { echo "::error::Tag moved before R2 upload"; exit 1; }

          mapfile -t entries < <(find r2-assets -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t files < <(find r2-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "${#entries[@]}" -eq "${#files[@]}" ] || { echo "::error::R2 asset set contains a non-regular entry"; exit 1; }
          [ "${#files[@]}" -eq 32 ] || { echo "::error::Expected 32 verified versioned objects, found ${#files[@]}"; exit 1; }

          download_and_compare() {
            local key="$1" expected="$2" tmp actual
            tmp=$(mktemp)
            if ! aws s3 cp "s3://$R2_BUCKET/$key" "$tmp" --endpoint-url "$R2_ENDPOINT" >/dev/null; then
              rm -f "$tmp"; return 1
            fi
            actual=$(sha256sum "$tmp" | awk '{print $1}')
            rm -f "$tmp"
            [ "$actual" = "$expected" ] || { echo "::error::R2 object $key has SHA-256 $actual, expected $expected"; return 1; }
          }
          verify_immutable_object() {
            local key="$1" expected_sha="$2" expected_etag="${3:-}" head stored_sha stored_etag
            head=$(mktemp)
            if ! aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" > "$head"; then
              rm -f "$head"; return 1
            fi
            stored_sha=$(jq -r '.Metadata.sha256 // empty' "$head")
            stored_etag=$(jq -r '.ETag // empty' "$head")
            rm -f "$head"
            [ "$stored_sha" = "$expected_sha" ] || { echo "::error::R2 object $key has unexpected sha256 metadata"; return 1; }
            [ -n "$stored_etag" ] && [ "$stored_etag" != null ] || { echo "::error::R2 object $key has no ETag"; return 1; }
            if [ -n "$expected_etag" ] && [ "$stored_etag" != "$expected_etag" ]; then
              echo "::error::R2 object $key ETag changed after creation"; return 1
            fi
            download_and_compare "$key" "$expected_sha"
            echo "Verified write-once object metadata, ETag, and bytes: $key"
          }
          put_immutable() {
            local file="$1" key="$2" sha="$3" err response created_etag
            err=$(mktemp)
            if response=$(aws s3api put-object --bucket "$R2_BUCKET" --key "$key" --body "$file" --if-none-match '*' \
              --metadata "sha256=$sha" --cache-control 'public, max-age=31536000, immutable' \
              --endpoint-url "$R2_ENDPOINT" 2>"$err"); then
              rm -f "$err"
              created_etag=$(printf '%s' "$response" | jq -r '.ETag // empty')
              [ -n "$created_etag" ] && [ "$created_etag" != null ] || { echo "::error::R2 creation returned no ETag for $key"; return 1; }
              verify_immutable_object "$key" "$sha" "$created_etag"
              return
            fi
            if ! grep -Eqi '412|PreconditionFailed|ConditionalRequestConflict|condition.*failed' "$err"; then
              echo "::error::Conditional R2 write failed for $key:"; cat "$err"; rm -f "$err"; return 1
            fi
            rm -f "$err"
            verify_immutable_object "$key" "$sha"
          }
          for name in "${files[@]}"; do
            sha=$(sha256sum "r2-assets/$name" | awk '{print $1}')
            put_immutable "r2-assets/$name" "$TAG/$name" "$sha"
          done

          for name in "${files[@]}"; do
            expected_sha=$(sha256sum "r2-assets/$name" | awk '{print $1}')
            public_verified=false
            for attempt in $(seq 1 12); do
              public_url="$R2_PUBLIC_BASE_URL/$TAG/$name?release_run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
              tmp=$(mktemp)
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' "$public_url" -o "$tmp"; then
                public_sha=$(sha256sum "$tmp" | awk '{print $1}')
                if [ "$public_sha" = "$expected_sha" ]; then public_verified=true; fi
              fi
              rm -f "$tmp"
              [ "$public_verified" = true ] && break
              [ "$attempt" -lt 12 ] && sleep 5
            done
            [ "$public_verified" = true ] || { echo "::error::Public versioned object $TAG/$name did not match its verified SHA-256"; exit 1; }
            echo "Verified public versioned object: $TAG/$name"
          done

      - name: Commit the sole mutable latest pointer with CAS
        if: steps.latest.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.contract.outputs.release_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          rm -rf root-commit
          mkdir -p root-commit

          verify_target() {
            local phase="$1" latest refs remote_source
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
            printf '%s' "$latest" | jq -e --argjson id "$RELEASE_ID" --arg tag "$TAG" '
              .id == $id and .tag_name == $tag
              and .draft == false and .prerelease == false
              and .immutable == true and (.published_at != null)
            ' >/dev/null || { echo "::error::Latest immutable release drifted $phase"; return 1; }
            refs=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
            remote_source=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$TAG"'^{}" {print $1; exit}')
            [ -n "$remote_source" ] || remote_source=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
            [ "$remote_source" = "$SOURCE_SHA" ] || { echo "::error::Tag moved $phase"; return 1; }
          }

          head_error=root-commit/head.err
          if aws s3api head-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$R2_ENDPOINT" > root-commit/head.json 2>"$head_error"; then
            root_state=present
            previous_etag=$(jq -r '.ETag // empty' root-commit/head.json)
            [ -n "$previous_etag" ] && [ "$previous_etag" != null ] || { echo "::error::Existing latest.json has no ETag"; exit 1; }
            aws s3api get-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$R2_ENDPOINT" root-commit/previous.json >/dev/null
          elif grep -Eqi '404|Not Found|NoSuchKey' "$head_error"; then
            root_state=absent
            previous_etag=''
          else
            echo "::error::Could not snapshot latest.json before CAS"
            cat "$head_error"
            exit 1
          fi

          expected_sha=$(sha256sum r2-assets/latest-r2.json | awk '{print $1}')
          committed_etag="$previous_etag"
          already_current=false
          if [ "$root_state" = present ]; then
            previous_sha=$(sha256sum root-commit/previous.json | awk '{print $1}')
            [ "$previous_sha" = "$expected_sha" ] && already_current=true
          fi

          verify_target 'immediately before the R2 root commit'
          if [ "$already_current" = true ]; then
            echo "Verified existing latest.json already matches $TAG."
          elif [ "$root_state" = present ]; then
            response=$(aws s3api put-object --bucket "$R2_BUCKET" --key latest.json --body r2-assets/latest-r2.json \
              --if-match "$previous_etag" --content-type application/json \
              --cache-control 'public, max-age=60, must-revalidate' --endpoint-url "$R2_ENDPOINT") || {
                echo "::error::CAS update failed for latest.json"; exit 1;
              }
            committed_etag=$(printf '%s' "$response" | jq -r '.ETag // empty')
          else
            response=$(aws s3api put-object --bucket "$R2_BUCKET" --key latest.json --body r2-assets/latest-r2.json \
              --if-none-match '*' --content-type application/json \
              --cache-control 'public, max-age=60, must-revalidate' --endpoint-url "$R2_ENDPOINT") || {
                echo "::error::CAS create failed for latest.json"; exit 1;
              }
            committed_etag=$(printf '%s' "$response" | jq -r '.ETag // empty')
          fi
          [ -n "$committed_etag" ] && [ "$committed_etag" != null ] || { echo "::error::latest.json commit returned no ETag"; exit 1; }

          persisted_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$R2_ENDPOINT" --query ETag --output text)
          [ "$persisted_etag" = "$committed_etag" ] || { echo "::error::latest.json changed after the conditional commit"; exit 1; }
          aws s3api get-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$R2_ENDPOINT" root-commit/persisted.json >/dev/null
          persisted_sha=$(sha256sum root-commit/persisted.json | awk '{print $1}')
          [ "$persisted_sha" = "$expected_sha" ] || { echo "::error::Persisted latest.json checksum mismatch"; exit 1; }
          verify_target 'after the R2 root commit'

          public_verified=false
          for attempt in $(seq 1 12); do
            public_url="$R2_PUBLIC_BASE_URL/latest.json?release_run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            if curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' "$public_url" -o root-commit/public.json; then
              public_sha=$(sha256sum root-commit/public.json | awk '{print $1}')
              if [ "$public_sha" = "$expected_sha" ]; then
                public_verified=true
                break
              fi
            fi
            [ "$attempt" -lt 12 ] && sleep 5
          done
          [ "$public_verified" = true ] || { echo "::error::Public latest.json did not expose the committed updater manifest"; exit 1; }
          verify_target 'after public latest.json verification'
          echo "Published and verified the sole mutable R2 pointer latest.json for $TAG."

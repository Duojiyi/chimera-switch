name: Release

# The workflow run name is also used by secure recovery callers to bind a
# dispatch request to exactly one run, rather than guessing by timestamp.
run-name: Release ${{ inputs.tag || github.event.client_payload.tag || github.ref_name }} / ${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}

on:
  repository_dispatch:
    types: [release-request]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build or repair (e.g. v3.20.1)'
        required: true
        type: string
      request_id:
        description: 'Optional caller-provided recovery correlation id'
        required: false
        type: string
      tooling_sha:
        description: 'Optional reviewed main SHA supplied by a secure recovery caller'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialize every draft writer and stable publisher across tags. This keeps
  # the single mutable R2 latest.json pointer ordered with GitHub publication.
  group: release-publisher
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
      tooling_sha: ${{ steps.validate.outputs.tooling_sha }}
    steps:
      - name: Validate requested tag
        id: validate
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.client_payload.tag || github.ref_name }}
          REQUESTED_TOOLING_SHA: ${{ inputs.tooling_sha || github.event.client_payload.tooling_sha || '' }}
          REQUESTED_REQUEST_ID: ${{ inputs.request_id || github.event.client_payload.request_id || '' }}
          RUN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] && [ "$GITHUB_EVENT_ACTION" != release-request ]; then
            echo "::error::Unexpected repository_dispatch action"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            printf '%s' "$REQUESTED_REQUEST_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' || {
              echo "::error::repository_dispatch request_id is missing or invalid"
              exit 1
            }
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release workflow_dispatch must run from the protected main branch"
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must match vX.Y.Z (received: ${REQUESTED_TAG:-empty})"
            exit 1
          fi
          refs=$(git ls-remote --exit-code "https://github.com/$REPOSITORY.git" "refs/tags/$REQUESTED_TAG" "refs/tags/$REQUESTED_TAG^{}")
          source_sha=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$REQUESTED_TAG"'^{}" {print $1; exit}')
          [ -n "$source_sha" ] || source_sha=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not resolve immutable commit for $REQUESTED_TAG"; exit 1; }

          main_sha=$(git ls-remote --exit-code "https://github.com/$REPOSITORY.git" refs/heads/main | awk 'NR == 1 {print $1}')
          printf '%s' "$main_sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not resolve immutable reviewed main SHA"; exit 1; }
          if [ "$main_sha" != "$RUN_SHA" ]; then
            echo "::error::Protected main moved while this workflow was dispatched ($main_sha != $RUN_SHA); rerun from the new main tip"
            exit 1
          fi
          if [ -n "$REQUESTED_TOOLING_SHA" ] && [ "$REQUESTED_TOOLING_SHA" != "$main_sha" ]; then
            echo "::error::The requested tooling SHA is no longer the current protected main SHA ($REQUESTED_TOOLING_SHA != $main_sha)"
            exit 1
          fi
          # Release tags must be reachable from main. This rejects a manually
          # created tag on unrelated or unreviewed history before any build job.
          comparison=$(gh api "repos/$REPOSITORY/compare/$source_sha...$main_sha" --jq .status)
          case "$comparison" in
            ahead|identical) ;;
            *) echo "::error::Release tag $REQUESTED_TAG is not reachable from main (compare status: $comparison)"; exit 1 ;;
          esac
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tooling_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $REQUESTED_TAG ($source_sha), reviewed tooling: $main_sha"

  release:
    runs-on: ${{ matrix.os }}
    needs: validate-release
    permissions:
      contents: read
    # Signing and attestation happen in separate trusted jobs after build.
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate-release.outputs.sha }}
      TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: windows-11-arm
            arch: arm64
            artifact: windows-arm64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            artifact: linux-arm64
          - os: macos-14
            artifact: macos

    steps:
      # Checkout the immutable release source first. A checkout action clears its
      # destination before initializing Git, so the trusted tooling checkout must
      # be created afterward in a separate path.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false

      - name: Checkout trusted release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Keep validation and artifact tooling on the reviewed default branch so
          # a repair of an older immutable tag does not execute stale tag scripts.
          ref: ${{ needs.validate-release.outputs.tooling_sha }}
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Verify source version
        shell: bash
        run: node .release-scripts/scripts/check-version.mjs "${RELEASE_TAG#v}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@10.12.3
          node --version
          [ "$(pnpm --version)" = 10.12.3 ] || { echo "::error::Unexpected pnpm version"; exit 1; }

      - name: Setup pnpm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack install --global pnpm@10.12.3
          node --version
          $actualPnpmVersion = (pnpm --version).Trim()
          if ($actualPnpmVersion -ne '10.12.3') {
            throw "Unexpected pnpm version: $actualPnpmVersion"
          }

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Build runners receive no release secret. The updater artifact is signed
      # again in the protected sign-release-assets job after this untrusted
      # source has finished building. This key only lets Tauri produce the
      # archive shape and is intentionally discarded before packaging.
      - name: Generate ephemeral Tauri signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/tauri-ephemeral.key"
          pnpm tauri signer generate --ci --write-keys "$KEY_PATH"
          chmod 600 "$KEY_PATH" || true
          echo "EPHEMERAL_SIGNING_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          TAURI_SIGNING_PRIVATE_KEY="$EPHEMERAL_SIGNING_KEY_PATH" \
            pnpm tauri build --target universal-apple-darwin
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:EPHEMERAL_SIGNING_KEY_PATH
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TAURI_SIGNING_PRIVATE_KEY="$EPHEMERAL_SIGNING_KEY_PATH" \
            pnpm tauri build --bundles appimage,deb,rpm

      - name: Remove ephemeral Tauri signing key
        if: always()
        shell: bash
        run: |
          set +e
          if [ -v EPHEMERAL_SIGNING_KEY_PATH ] && [ -f "$EPHEMERAL_SIGNING_KEY_PATH" ]; then
            shred -u "$EPHEMERAL_SIGNING_KEY_PATH" 2>/dev/null || rm -f "$EPHEMERAL_SIGNING_KEY_PATH"
            rm -f "$EPHEMERAL_SIGNING_KEY_PATH.pub"
          fi

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"  # e.g., v3.5.0

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # 1) Collect .tar.gz (updater artifact). The build signature is
          # intentionally discarded; the protected signer signs this final
          # published filename after all renaming is complete.
          NEW_TAR_GZ="Chimera-Switch-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          # 2) Collect .app as zip
          NEW_ZIP="Chimera-Switch-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (unsigned)
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="Chimera-Switch-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/Chimera Switch.app"

          create-dmg \
            --volname "Chimera Switch" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "Chimera Switch.app" 180 220 \
            --hide-extension "Chimera Switch.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:RELEASE_TAG  # e.g., v3.5.0
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器。签名在受保护 job 中针对最终文件名生成。
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "Chimera-Switch-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
          } else {
            throw "No Windows $assetSuffix MSI installer found"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/chimera-switch.exe')
          } else {
            @(
              'src-tauri/target/release/chimera-switch.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/chimera-switch.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/Chimera-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# Chimera Switch portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# Chimera Switch portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/Chimera-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: Chimera-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
          } else {
            Write-Warning "Portable $assetSuffix exe not found; continuing without optional portable package"
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"  # e.g., v3.5.0
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact. The build signature is intentionally discarded;
          # the protected signer creates the final signature after renaming.
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="Chimera-Switch-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "❌ No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/Chimera-Switch-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: Chimera-Switch-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/Chimera-Switch-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: Chimera-Switch-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-assets-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  attest-release-assets:
    name: Attest ${{ matrix.group }} build assets
    runs-on: ubuntu-22.04
    needs: [validate-release, release]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.validate-release.outputs.sha }}
      TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
      ARTIFACT_GROUP: ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: macos
            artifact: unsigned-release-assets-macos
          - group: windows-x64
            artifact: unsigned-release-assets-windows-x64
          - group: windows-arm64
            artifact: unsigned-release-assets-windows-arm64
          - group: linux-x64
            artifact: unsigned-release-assets-linux-x64
          - group: linux-arm64
            artifact: unsigned-release-assets-linux-arm64
    steps:
      # This job deliberately checks out and executes no repository source. It
      # only consumes the exact finalized artifact produced by its matrix group.
      - name: Resolve exact builder artifact identity
        id: builder-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NAME: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          repository_id=$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --slurp \
            | jq -c --arg name "$EXPECTED_NAME" '[.[] | .artifacts[] | select(.name == $name)]')
          [ "$(printf '%s' "$matches" | jq 'length')" -eq 1 ] || { echo "::error::Expected exactly one current-attempt artifact named $EXPECTED_NAME"; exit 1; }
          artifact=$(printf '%s' "$matches" | jq -c '.[0]')
          printf '%s' "$artifact" | jq -e --argjson run "$GITHUB_RUN_ID" --argjson repo "$repository_id" --arg sha "$TOOLING_SHA" '
            (.id | type) == "number" and .id > 0
            and .expired == false
            and .size_in_bytes > 0
            and (.digest | test("^sha256:[0-9a-f]{64}$"))
            and .workflow_run.id == $run
            and .workflow_run.repository_id == $repo
            and .workflow_run.head_repository_id == $repo
            and .workflow_run.head_sha == $sha
          ' >/dev/null || { echo "::error::Builder artifact identity contract failed for $EXPECTED_NAME"; exit 1; }
          printf 'artifact_id=%s\narchive_digest=%s\nartifact_name=%s\n' \
            "$(printf '%s' "$artifact" | jq -r .id)" \
            "$(printf '%s' "$artifact" | jq -r .digest)" \
            "$EXPECTED_NAME" >> "$GITHUB_OUTPUT"
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifact.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: attestation-input

      - name: Validate artifact boundary and write trusted predicate
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          ARTIFACT_ID: ${{ steps.builder-artifact.outputs.artifact_id }}
          ARTIFACT_ARCHIVE_DIGEST: ${{ steps.builder-artifact.outputs.archive_digest }}
          ARTIFACT_NAME: ${{ steps.builder-artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          declare -A mandatory
          mandatory[macos]='Chimera-Switch-'"$RELEASE_TAG"'-macOS.dmg Chimera-Switch-'"$RELEASE_TAG"'-macOS.tar.gz Chimera-Switch-'"$RELEASE_TAG"'-macOS.zip'
          mandatory[windows-x64]='Chimera-Switch-'"$RELEASE_TAG"'-Windows.msi Chimera-Switch-'"$RELEASE_TAG"'-Windows-Portable.zip'
          mandatory[windows-arm64]='Chimera-Switch-'"$RELEASE_TAG"'-Windows-arm64.msi Chimera-Switch-'"$RELEASE_TAG"'-Windows-arm64-Portable.zip'
          mandatory[linux-x64]='Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.AppImage Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.deb Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.rpm'
          mandatory[linux-arm64]='Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.AppImage Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.deb Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.rpm'
          mapfile -t entries < <(find attestation-input -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t files < <(find attestation-input -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "${#entries[@]}" -eq "${#files[@]}" ] || { echo "::error::Artifact contains a non-regular or nested entry"; exit 1; }
          IFS=' ' read -r -a expected <<< "${mandatory[$ARTIFACT_GROUP]}"
          [ "${#files[@]}" -eq "${#expected[@]}" ] || { echo "::error::Unexpected file count in $ARTIFACT_GROUP"; exit 1; }
          for name in "${expected[@]}"; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$name" || { echo "::error::Missing attestation subject $ARTIFACT_GROUP/$name"; exit 1; }
            [ -s "attestation-input/$name" ] || { echo "::error::Empty attestation subject $ARTIFACT_GROUP/$name"; exit 1; }
          done
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = "attestation-input";
          const assets = Object.fromEntries(readdirSync(dir).sort().map((name) => [
            name,
            createHash("sha256").update(readFileSync(join(dir, name))).digest("hex"),
          ]));
          writeFileSync("build-provenance.json", JSON.stringify({
            schemaVersion: 1,
            sourceSha: process.env.SOURCE_SHA,
            toolingSha: process.env.TOOLING_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            runner: process.env.RUNNER_OS,
            artifactGroup: process.env.ARTIFACT_GROUP,
            artifactId: Number(process.env.ARTIFACT_ID),
            artifactName: process.env.ARTIFACT_NAME,
            artifactArchiveDigest: process.env.ARTIFACT_ARCHIVE_DIGEST,
            assets,
          }, null, 2) + "\n");
          NODE

      - name: Attest exact build artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: attestation-input/*
          predicate-type: https://chimera-switch.dev/provenance/release-build/v1
          predicate-path: build-provenance.json

  sign-release-assets:
    name: Sign updater assets
    runs-on: ubuntu-22.04
    needs: [validate-release, release, attest-release-assets]
    environment: release
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      signed_artifact_id: ${{ steps.upload-signed.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate-release.outputs.sha }}
      TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
    steps:
      - name: Checkout trusted signer tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release.outputs.tooling_sha }}
          path: .signing-tooling
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        working-directory: .signing-tooling
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@10.12.3
          [ "$(pnpm --version)" = 10.12.3 ] || { echo "::error::Unexpected pnpm version"; exit 1; }

      - name: Install trusted signer tooling
        working-directory: .signing-tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Download each known matrix artifact by its exact name. A broad pattern
      # would allow any extra artifact uploaded during this run to participate in
      # signing, and merge-multiple could silently resolve duplicate filenames.
      - name: Resolve exact current-attempt builder artifacts
        id: builder-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository_id=$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)
          pages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --slurp)
          bindings='[]'
          for spec in \
            'macos:unsigned-release-assets-macos' \
            'windows_x64:unsigned-release-assets-windows-x64' \
            'windows_arm64:unsigned-release-assets-windows-arm64' \
            'linux_x64:unsigned-release-assets-linux-x64' \
            'linux_arm64:unsigned-release-assets-linux-arm64'; do
            key=${spec%%:*}
            group=${key//_/-}
            base=${spec#*:}
            expected_name="$base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            matches=$(printf '%s' "$pages" | jq -c --arg name "$expected_name" '[.[] | .artifacts[] | select(.name == $name)]')
            [ "$(printf '%s' "$matches" | jq 'length')" -eq 1 ] || { echo "::error::Expected exactly one current-attempt artifact named $expected_name"; exit 1; }
            artifact=$(printf '%s' "$matches" | jq -c '.[0]')
            printf '%s' "$artifact" | jq -e --argjson run "$GITHUB_RUN_ID" --argjson repo "$repository_id" --arg sha "$TOOLING_SHA" '
              (.id | type) == "number" and .id > 0
              and .expired == false
              and .size_in_bytes > 0
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
              and .workflow_run.id == $run
              and .workflow_run.repository_id == $repo
              and .workflow_run.head_repository_id == $repo
              and .workflow_run.head_sha == $sha
            ' >/dev/null || { echo "::error::Builder artifact identity contract failed for $expected_name"; exit 1; }
            artifact_id=$(printf '%s' "$artifact" | jq -r .id)
            archive_digest=$(printf '%s' "$artifact" | jq -r .digest)
            printf '%s_id=%s\n%s_digest=%s\n' "$key" "$artifact_id" "$key" "$archive_digest" >> "$GITHUB_OUTPUT"
            bindings=$(printf '%s' "$bindings" | jq -c --arg group "$group" --arg name "$expected_name" --argjson id "$artifact_id" --arg digest "$archive_digest" \
              '. + [{group: $group, name: $name, id: $id, archiveDigest: $digest}]')
          done
          printf '%s' "$bindings" | jq -S \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg toolingSha "$TOOLING_SHA" \
            '{runId: $runId, runAttempt: $runAttempt, sourceSha: $sourceSha, toolingSha: $toolingSha, artifacts: .}' \
            > .signing-tooling/artifact-bindings.json
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifacts.outputs.macos_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .signing-tooling/incoming/macos
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifacts.outputs.windows_x64_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .signing-tooling/incoming/windows-x64
      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifacts.outputs.windows_arm64_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .signing-tooling/incoming/windows-arm64
      - name: Download Linux x64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifacts.outputs.linux_x64_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .signing-tooling/incoming/linux-x64
      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.builder-artifacts.outputs.linux_arm64_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .signing-tooling/incoming/linux-arm64

      - name: Assemble and validate matrix artifacts
        working-directory: .signing-tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          declare -A mandatory optional
          mandatory[macos]='Chimera-Switch-'"$RELEASE_TAG"'-macOS.dmg Chimera-Switch-'"$RELEASE_TAG"'-macOS.tar.gz Chimera-Switch-'"$RELEASE_TAG"'-macOS.zip'
          mandatory[windows-x64]='Chimera-Switch-'"$RELEASE_TAG"'-Windows.msi Chimera-Switch-'"$RELEASE_TAG"'-Windows-Portable.zip'
          mandatory[windows-arm64]='Chimera-Switch-'"$RELEASE_TAG"'-Windows-arm64.msi Chimera-Switch-'"$RELEASE_TAG"'-Windows-arm64-Portable.zip'
          mandatory[linux-x64]='Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.AppImage Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.deb Chimera-Switch-'"$RELEASE_TAG"'-Linux-x86_64.rpm'
          mandatory[linux-arm64]='Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.AppImage Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.deb Chimera-Switch-'"$RELEASE_TAG"'-Linux-arm64.rpm'
          optional[macos]=''
          optional[windows-x64]=''
          optional[windows-arm64]=''
          optional[linux-x64]=''
          optional[linux-arm64]=''
          for group in macos windows-x64 windows-arm64 linux-x64 linux-arm64; do
            dir="incoming/$group"
            mapfile -t files < <(find "$dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
            IFS=' ' read -r -a mandatory_names <<< "${mandatory[$group]}"
            IFS=' ' read -r -a optional_names <<< "${optional[$group]}"
            allowed_names=("${mandatory_names[@]}" "${optional_names[@]}")
            for name in "${mandatory_names[@]}"; do
              [ -n "$name" ] && printf '%s\n' "${files[@]}" | grep -Fxq "$name" || { echo "::error::Missing mandatory file in $group artifact: $name"; exit 1; }
            done
            for name in "${files[@]}"; do
              printf '%s\n' "${allowed_names[@]}" | grep -Fxq "$name" || { echo "::error::Unexpected file in $group artifact: $name"; exit 1; }
              [ ! -e "release-assets/$name" ] || { echo "::error::Duplicate artifact filename: $name"; exit 1; }
              cp -- "$dir/$name" "release-assets/$name"
            done
          done

      - name: Verify updater asset set before signing
        working-directory: .signing-tooling
        env:
          UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
        run: node scripts/verify-release-assets.mjs release-assets "${{ env.RELEASE_TAG }}" "${{ github.repository }}" - "" --unsigned --require-user-assets

      - name: Verify builder attestations before signing
        working-directory: .signing-tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREDICATE_TYPE: https://chimera-switch.dev/provenance/release-build/v1
          TOOLING_SHA: ${{ env.TOOLING_SHA }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          # The CLI verifies the Sigstore certificate, transparency proof, signer
          # workflow, source ref, and predicate type. The JSON policy below binds
          # the signed statement to this exact run, reviewed tooling commit, build
          # group, complete input set, and every downloaded subject digest.
          run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          printf '%s' "$run_info" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg tooling "$TOOLING_SHA" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '.path == ".github/workflows/release.yml" and (.event == "workflow_dispatch" or .event == "repository_dispatch") and .head_branch == "main" and .head_sha == $tooling and .repository.full_name == $repo and .run_attempt == $attempt' >/dev/null || {
            echo "::error::Current GitHub Actions run is not the expected protected release builder run"
            exit 1
          }
          for group in macos windows-x64 windows-arm64 linux-x64 linux-arm64; do
            dir="incoming/$group"
            binding=$(jq -c --arg group "$group" '.artifacts[] | select(.group == $group)' artifact-bindings.json)
            [ -n "$binding" ] || { echo "::error::Missing immutable artifact binding for $group"; exit 1; }
            artifact_id=$(printf '%s' "$binding" | jq -r .id)
            artifact_name=$(printf '%s' "$binding" | jq -r .name)
            archive_digest=$(printf '%s' "$binding" | jq -r .archiveDigest)
            mapfile -t files < <(find "$dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::No files found for attested build group $group"; exit 1; }
            asset_lines=()
            for name in "${files[@]}"; do
              sha=$(sha256sum "$dir/$name" | awk '{print $1}')
              asset_lines+=("$name"$'\t'"$sha")
            done
            expected_assets=$(printf '%s\n' "${asset_lines[@]}" | jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | from_entries')
            for name in "${files[@]}"; do
              file="$dir/$name"
              sha=$(sha256sum "$file" | awk '{print $1}')
              attestation="$RUNNER_TEMP/attestation-$group-${name//[^A-Za-z0-9_.-]/_}.json"
              gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --format json \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref refs/heads/main \
                --source-digest "$TOOLING_SHA" \
                --predicate-type "$PREDICATE_TYPE" \
                --deny-self-hosted-runners > "$attestation"
              jq -e --arg predicate "$PREDICATE_TYPE" --arg source "$SOURCE_SHA" \
                --arg tooling "$TOOLING_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
                --arg group "$group" --arg file "$name" --arg sha "$sha" \
                --arg artifact_name "$artifact_name" --arg archive_digest "$archive_digest" --arg artifact_id "$artifact_id" \
                --argjson expected_assets "$expected_assets" '
                [ .[]
                  | .verificationResult.statement as $statement
                  | select(
                      $statement.predicateType == $predicate
                      and $statement.predicate.sourceSha == $source
                      and $statement.predicate.toolingSha == $tooling
                      and ($statement.predicate.workflowRunId | tostring) == $run
                      and ($statement.predicate.workflowRunAttempt | tostring) == $attempt
                      and $statement.predicate.artifactGroup == $group
                      and ($statement.predicate.artifactId | tostring) == $artifact_id
                      and $statement.predicate.artifactName == $artifact_name
                      and $statement.predicate.artifactArchiveDigest == $archive_digest
                      and $statement.predicate.assets == $expected_assets
                      and any($statement.subject[]?;
                        ((.name == $file or .name == ("release-assets/" + $file) or (.name | endswith("/" + $file)))
                          and .digest.sha256 == $sha))
                    )
                ] | length == 1
              ' "$attestation" >/dev/null || {
                echo "::error::Attestation policy mismatch for $group/$name"
                jq . "$attestation"
                exit 1
              }
            done
          done

      - name: Sign updater assets in protected environment
        working-directory: .signing-tooling
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::notice::No Tauri signing password is configured; attempting the existing key with an empty passphrase and requiring public-key verification"
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-signing.key"
          trap 'shred -u "$KEY_PATH" 2>/dev/null || rm -f "$KEY_PATH"' EXIT
          # Tauri stores this secret as one base64 string whose decoded
          # payload is the minisign/rsign encrypted secret-key envelope. Keep
          # the outer encoding intact: tauri signer expects that representation
          # in --private-key-path and rejects the decoded envelope as malformed.
          ONE=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | tr -d '\n')
          if ! printf '%s' "$ONE" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$' || [ $(( ${#ONE} % 4 )) -ne 0 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must be canonical base64"
            exit 1
          fi
          DECODED=$(printf '%s' "$ONE" | base64 --decode 2>/dev/null || true)
          REENCODED=$(printf '%s' "$ONE" | base64 --decode 2>/dev/null | base64 -w0 || true)
          if [ "$REENCODED" != "$ONE" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not canonical base64"
            exit 1
          fi
          if ! printf '%s' "$DECODED" | head -n1 | grep -q '^untrusted comment: rsign encrypted secret key$'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a Tauri rsign private-key envelope"
            exit 1
          fi
          printf '%s\n' "$ONE" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          mapfile -t signable < <(find release-assets -mindepth 1 -maxdepth 1 -type f ! -name '*.sig' ! -name 'provenance.json' ! -name 'latest.json' -printf '%f\n' | sort)
          [ "${#signable[@]}" -eq 13 ] || { echo "::error::Expected exactly 13 complete release artifacts before signing, found ${#signable[@]}"; exit 1; }
          for name in "${signable[@]}"; do
            file="release-assets/$name"
            [ -s "$file" ] || { echo "::error::Missing release artifact: $name"; exit 1; }
            rm -f "$file.sig"
            pnpm tauri signer sign --private-key-path "$KEY_PATH" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$file"
            [ -s "$file.sig" ] || { echo "::error::Signing produced no signature: $name"; exit 1; }
          done
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = "release-assets";
          const assets = Object.fromEntries(readdirSync(dir).filter((name) => name !== "provenance.json").sort().map((name) => [name, createHash("sha256").update(readFileSync(join(dir, name))).digest("hex")]));
          const provenance = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            tag: process.env.RELEASE_TAG,
            sourceSha: process.env.SOURCE_SHA,
            toolingSha: process.env.TOOLING_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            assets,
          };
          writeFileSync(join(dir, "provenance.json"), `${JSON.stringify(provenance, null, 2)}\n`);
          NODE
          pnpm tauri signer sign --private-key-path "$KEY_PATH" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "release-assets/provenance.json"
          [ -s release-assets/provenance.json.sig ] || { echo "::error::Signing produced no provenance signature"; exit 1; }
          node scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" - "$UPDATER_PUBLIC_KEY" --require-user-assets \
            --expected-source-sha="$SOURCE_SHA" --expected-tooling-sha="$TOOLING_SHA"

      - name: Upload signed release assets
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signing-tooling/release-assets/*
          if-no-files-found: error

  assemble-release-assets:
    name: Assemble complete release asset set
    runs-on: ubuntu-22.04
    needs: [validate-release, sign-release-assets]
    permissions:
      contents: read
      actions: read
    outputs:
      complete_artifact_id: ${{ steps.upload-complete.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate-release.outputs.sha }}
      TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
      UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
    steps:
      - name: Checkout trusted release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release.outputs.tooling_sha }}
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-release-assets.outputs.signed_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Generate deterministic updater manifest and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pub_date=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.commit.committer.date')
          [ -n "$pub_date" ] && [ "$pub_date" != null ] || { echo "::error::Source commit timestamp is unavailable"; exit 1; }
          node .release-scripts/scripts/generate-latest-json.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets/latest.json "$pub_date"
          node .release-scripts/scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets/latest.json "$UPDATER_PUBLIC_KEY" \
            --require-user-assets --expected-source-sha="$SOURCE_SHA" --expected-tooling-sha="$TOOLING_SHA"

      - name: Upload complete release asset set
        id: upload-complete
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error

  publish-release-draft:
    name: Publish verified release draft
    runs-on: ubuntu-22.04
    needs: [validate-release, assemble-release-assets]
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate-release.outputs.sha }}
      TOOLING_SHA: ${{ needs.validate-release.outputs.tooling_sha }}
      UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release.outputs.tooling_sha }}
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.assemble-release-assets.outputs.complete_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Verify complete assets before write access is used
        run: |
          set -euo pipefail
          node .release-scripts/scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets/latest.json "$UPDATER_PUBLIC_KEY" \
            --require-user-assets --expected-source-sha="$SOURCE_SHA" --expected-tooling-sha="$TOOLING_SHA"

      - name: Create or reuse bot-owned draft and upload assets
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          remote_sha=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$RELEASE_TAG"'^{}" {print $1; exit}')
          [ -n "$remote_sha" ] || remote_sha=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          [ "$remote_sha" = "$RELEASE_SHA" ] || { echo "::error::Tag $RELEASE_TAG moved during the build ($remote_sha != $RELEASE_SHA)"; exit 1; }

          marker='<!-- chimera-automated-release-draft:v1 -->'
          expected_title="Chimera Switch $RELEASE_TAG"
          cat > release-notes.md <<EOF
          $marker
          ## Chimera Switch $RELEASE_TAG

          🌐 **Only Official Website / 唯一官方网站 / 唯一の公式サイト**: [api.chimerahub.org](https://api.chimerahub.org)

          Claude Code 供应商切换工具

          ### 下载

          - macOS: Chimera-Switch-$RELEASE_TAG-macOS.dmg（推荐）或 Chimera-Switch-$RELEASE_TAG-macOS.zip（解压即用）
          - Windows (x86_64): Chimera-Switch-$RELEASE_TAG-Windows.msi（安装版）或 Chimera-Switch-$RELEASE_TAG-Windows-Portable.zip（绿色版）
          - Windows (ARM64): Chimera-Switch-$RELEASE_TAG-Windows-arm64.msi（安装版）或 Chimera-Switch-$RELEASE_TAG-Windows-arm64-Portable.zip（绿色版）
          - Linux (x86_64): Chimera-Switch-$RELEASE_TAG-Linux-x86_64.AppImage / .deb / .rpm
          - Linux (ARM64): Chimera-Switch-$RELEASE_TAG-Linux-arm64.AppImage / .deb / .rpm

          > .tar.gz 为 Tauri updater 自动更新专用，无需手动下载。

          ---
          macOS 版本未签名：首次打开请在「系统设置 → 隐私与安全性」点击「仍要打开」，或右键应用选「打开」。
          EOF

          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            | jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(printf '%s' "$matches" | jq 'length')
          [ "$count" -le 1 ] || { echo "::error::Multiple releases unexpectedly match $RELEASE_TAG"; exit 1; }

          verify_draft_identity() {
            local payload=$1
            local expected_id=$2
            printf '%s' "$expected_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid draft release id"; return 1; }
            printf '%s' "$payload" | jq -e \
              --argjson id "$expected_id" \
              --arg tag "$RELEASE_TAG" \
              --arg title "$expected_title" \
              --arg marker "$marker" '
                .id == $id
                and .tag_name == $tag
                and .draft == true
                and .prerelease == false
                and .name == $title
                and .author.login == "github-actions[bot]"
                and ((.body // "") | contains($marker))
              ' >/dev/null
          }

          if [ "$count" -eq 1 ]; then
            release=$(printf '%s' "$matches" | jq -c '.[0]')
            release_id=$(printf '%s' "$release" | jq -r '.id // empty')
            verify_draft_identity "$release" "$release_id" || { echo "::error::Existing release is not the expected bot-owned draft"; exit 1; }
            echo "Reusing verified bot-owned draft $RELEASE_TAG (release id $release_id)."
          else
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg target "$RELEASE_SHA" \
              --arg title "$expected_title" \
              --rawfile body release-notes.md \
              '{tag_name:$tag,target_commitish:$target,name:$title,body:$body,draft:true,prerelease:false,make_latest:"false"}' \
              > create-release.json
            release=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input create-release.json)
            release_id=$(printf '%s' "$release" | jq -r '.id // empty')
            verify_draft_identity "$release" "$release_id" || { echo "::error::New release response is not the expected bot-owned draft"; exit 1; }
            # Never proceed from a creation response alone. Re-read the exact ID
            # so reconciliation is bound to the persisted GitHub object.
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
            verify_draft_identity "$release" "$release_id" || { echo "::error::New draft could not be verified by release id"; exit 1; }
          fi
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

          # A failed attempt may leave a partial draft. Reconcile only the exact
          # bot-owned release id: keep byte-identical healthy assets, delete all
          # stale/duplicate/unexpected assets, then upload the missing contract.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          verify_draft_identity "$release" "$release_id" || { echo "::error::Release left the expected bot-owned draft state before reconciliation"; exit 1; }
          rm -rf existing-release-assets
          mkdir -p existing-release-assets
          while IFS= read -r encoded; do
            asset=$(printf '%s' "$encoded" | base64 --decode)
            asset_id=$(printf '%s' "$asset" | jq -r .id)
            printf '%s' "$asset_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid existing draft asset id"; exit 1; }
            name=$(printf '%s' "$asset" | jq -r .name)
            keep=false
            duplicate_count=$(printf '%s' "$release" | jq --arg name "$name" '[.assets[] | select(.name == $name)] | length')
            if [ "$duplicate_count" -eq 1 ] \
              && printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$' \
              && [ -f "release-assets/$name" ]; then
              expected_size=$(stat -c %s "release-assets/$name")
              expected_digest="sha256:$(sha256sum "release-assets/$name" | awk '{print $1}')"
              if printf '%s' "$asset" | jq -e --argjson size "$expected_size" --arg digest "$expected_digest" '
                .state == "uploaded" and .size == $size and .digest == $digest
              ' >/dev/null; then
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "existing-release-assets/$asset_id"
                if cmp -s "release-assets/$name" "existing-release-assets/$asset_id"; then
                  keep=true
                  echo "Verified existing draft asset: $name ($asset_id)"
                fi
              fi
            fi
            if [ "$keep" != true ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              echo "Removed stale draft asset: $name ($asset_id)"
            fi
          done < <(printf '%s' "$release" | jq -r '.assets[] | @base64')

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          while IFS= read -r file; do
            name=$(basename "$file")
            existing_count=$(printf '%s' "$release" | jq --arg name "$name" '[.assets[] | select(.name == $name)] | length')
            [ "$existing_count" -le 1 ] || { echo "::error::Duplicate draft asset remains: $name"; exit 1; }
            if [ "$existing_count" -eq 0 ]; then
              encoded_name=$(jq -nr --arg name "$name" '$name | @uri')
              expected_size=$(stat -c %s "$file")
              expected_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
              upload_response=$(gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
                --input "$file" -H 'Content-Type: application/octet-stream')
              uploaded_asset_id=$(printf '%s' "$upload_response" | jq -r '.id // empty')
              printf '%s' "$uploaded_asset_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Upload returned an invalid asset id for $name"; exit 1; }

              metadata_verified=false
              for attempt in $(seq 1 10); do
                uploaded_asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$uploaded_asset_id")
                if printf '%s' "$uploaded_asset" | jq -e \
                  --argjson id "$uploaded_asset_id" \
                  --arg name "$name" \
                  --argjson size "$expected_size" \
                  --arg digest "$expected_digest" '
                    .id == $id and .name == $name and .state == "uploaded" and .size == $size and .digest == $digest
                  ' >/dev/null; then
                  metadata_verified=true
                  break
                fi
                [ "$attempt" -lt 10 ] && sleep 2
              done
              [ "$metadata_verified" = true ] || { echo "::error::Persisted asset metadata mismatch after upload: $name"; exit 1; }

              release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
              verify_draft_identity "$release" "$release_id" || { echo "::error::Draft identity changed after uploading $name"; exit 1; }
              printf '%s' "$release" | jq -e \
                --argjson id "$uploaded_asset_id" \
                --arg name "$name" \
                --argjson size "$expected_size" \
                --arg digest "$expected_digest" '
                  [.assets[] | select(.id == $id and .name == $name and .state == "uploaded" and .size == $size and .digest == $digest)] | length == 1
                ' >/dev/null || { echo "::error::Uploaded asset is not bound to the expected draft: $name"; exit 1; }
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$uploaded_asset_id" > "existing-release-assets/uploaded-$uploaded_asset_id"
              cmp -s "$file" "existing-release-assets/uploaded-$uploaded_asset_id" || { echo "::error::Uploaded asset bytes differ from local file: $name"; exit 1; }
              echo "Uploaded and re-verified draft asset: $name ($uploaded_asset_id)"
            fi
          done < <(find release-assets -maxdepth 1 -type f -print | sort)

      - name: Re-download and verify complete draft snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_ID" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid final draft release id"; exit 1; }
          marker='<!-- chimera-automated-release-draft:v1 -->'
          expected_title="Chimera Switch $RELEASE_TAG"
          verify_draft_identity() {
            local payload=$1
            printf '%s' "$payload" | jq -e \
              --argjson id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg title "$expected_title" \
              --arg marker "$marker" '
                .id == $id
                and .tag_name == $tag
                and .draft == true
                and .prerelease == false
                and .name == $title
                and .author.login == "github-actions[bot]"
                and ((.body // "") | contains($marker))
              ' >/dev/null
          }
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          verify_draft_identity "$release" || { echo "::error::Release is no longer the expected bot-owned draft"; exit 1; }
          printf '%s' "$release" | jq '[.assets[] | {name,id,size,digest,state}] | sort_by(.name)' > release-asset-snapshot.json
          node .release-scripts/scripts/validate-release-asset-snapshot.mjs release-asset-snapshot.json "$RELEASE_TAG"
          rm -rf release-assets-final
          mkdir -p release-assets-final
          while IFS=$'\t' read -r asset_id name; do
            printf '%s' "$asset_id" | grep -Eq '^[1-9][0-9]*$' || { echo "::error::Invalid final draft asset id"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "release-assets-final/$name"
          done < <(jq -r '.[] | [.id,.name] | @tsv' release-asset-snapshot.json)
          node .release-scripts/scripts/validate-release-asset-snapshot.mjs release-asset-snapshot.json "$RELEASE_TAG" release-assets-final
          node .release-scripts/scripts/verify-release-assets.mjs release-assets-final "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets-final/latest.json "$UPDATER_PUBLIC_KEY" \
            --require-user-assets --expected-source-sha="$SOURCE_SHA" --expected-tooling-sha="$TOOLING_SHA"
          final_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          verify_draft_identity "$final_release" || { echo "::error::Draft identity changed during final verification"; exit 1; }
          printf '%s' "$final_release" | jq '[.assets[] | {name,id,size,digest,state}] | sort_by(.name)' > release-asset-snapshot-final.json
          cmp -s release-asset-snapshot.json release-asset-snapshot-final.json || { echo "::error::Draft assets changed during final verification"; exit 1; }
          echo "Verified complete bot-owned draft $RELEASE_TAG (release id $RELEASE_ID); stable publication is a separate gated operation."

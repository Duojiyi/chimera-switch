name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build or repair (e.g. v3.20.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # A manual repair must be allowed to finish alongside an earlier attempt.
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate requested tag
        id: validate
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must match vX.Y.Z (received: ${REQUESTED_TAG:-empty})"
            exit 1
          fi
          refs=$(git ls-remote --exit-code "https://github.com/$REPOSITORY.git" "refs/tags/$REQUESTED_TAG" "refs/tags/$REQUESTED_TAG^{}")
          source_sha=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$REQUESTED_TAG"'^{}" {print $1; exit}')
          if [ -z "$source_sha" ]; then
            source_sha=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          fi
          if ! printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve immutable commit for tag $REQUESTED_TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $REQUESTED_TAG ($source_sha)"

  release:
    runs-on: ${{ matrix.os }}
    needs: validate-release
    permissions:
      contents: read
    # Signing happens in the protected sign-release-assets job after build.
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-14

    steps:
      # Checkout the immutable release source first. A checkout action clears its
      # destination before initializing Git, so the trusted tooling checkout must
      # be created afterward in a separate path.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false

      - name: Checkout trusted release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Keep validation and artifact tooling on the reviewed default branch so
          # a repair of an older immutable tag does not execute stale tag scripts.
          ref: main
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Verify source version
        shell: bash
        run: node .release-scripts/scripts/check-version.mjs "${RELEASE_TAG#v}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Build runners receive no release secret. The updater artifact is signed
      # again in the protected sign-release-assets job after this untrusted
      # source has finished building. This key only lets Tauri produce the
      # archive shape and is intentionally discarded before packaging.
      - name: Generate ephemeral Tauri signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/tauri-ephemeral.key"
          pnpm tauri signer generate --ci --write-keys "$KEY_PATH"
          chmod 600 "$KEY_PATH" || true
          echo "EPHEMERAL_SIGNING_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          TAURI_SIGNING_PRIVATE_KEY="$EPHEMERAL_SIGNING_KEY_PATH" \
            pnpm tauri build --target universal-apple-darwin
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:EPHEMERAL_SIGNING_KEY_PATH
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TAURI_SIGNING_PRIVATE_KEY="$EPHEMERAL_SIGNING_KEY_PATH" \
            pnpm tauri build --bundles appimage,deb,rpm

      - name: Remove ephemeral Tauri signing key
        if: always()
        shell: bash
        run: |
          set +e
          if [ -v EPHEMERAL_SIGNING_KEY_PATH ] && [ -f "$EPHEMERAL_SIGNING_KEY_PATH" ]; then
            shred -u "$EPHEMERAL_SIGNING_KEY_PATH" 2>/dev/null || rm -f "$EPHEMERAL_SIGNING_KEY_PATH"
            rm -f "$EPHEMERAL_SIGNING_KEY_PATH.pub"
          fi

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"  # e.g., v3.5.0

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # 1) Collect .tar.gz (updater artifact)
          NEW_TAR_GZ="Chimera-Switch-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          if [ ! -f "$TAR_GZ.sig" ]; then
            echo "❌ Signature for macOS updater artifact not found" >&2
            exit 1
          fi
          cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          # 2) Collect .app as zip
          NEW_ZIP="Chimera-Switch-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (unsigned)
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="Chimera-Switch-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/Chimera Switch.app"

          create-dmg \
            --volname "Chimera Switch" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "Chimera Switch.app" 180 220 \
            --hide-extension "Chimera Switch.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:RELEASE_TAG  # e.g., v3.5.0
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "Chimera-Switch-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
             # The build runner uses an ephemeral key only to satisfy Tauri's
             # bundle step. The protected signer must create the final
             # signature after this asset has its published name.
             Write-Host "Temporary build signature intentionally not uploaded: $dest.sig"
          } else {
            throw "No Windows $assetSuffix MSI installer found"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/chimera-switch.exe')
          } else {
            @(
              'src-tauri/target/release/chimera-switch.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/chimera-switch.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/Chimera-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# Chimera Switch portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# Chimera Switch portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/Chimera-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: Chimera-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
          } elseif ($isArm64) {
            throw 'Portable ARM64 exe not found'
          } else {
            Write-Warning 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"  # e.g., v3.5.0
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="Chimera-Switch-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            if [ ! -f "$APPIMAGE.sig" ]; then
              echo "❌ Signature for AppImage updater artifact not found" >&2
              exit 1
            fi
            cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "❌ No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/Chimera-Switch-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: Chimera-Switch-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/Chimera-Switch-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: Chimera-Switch-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  sign-release-assets:
    name: Sign updater assets
    runs-on: ubuntu-22.04
    needs: [validate-release, release]
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    steps:
      - name: Checkout trusted signer tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: .signing-tooling
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        working-directory: .signing-tooling
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack install

      - name: Install trusted signer tooling
        working-directory: .signing-tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download unsigned release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unsigned-release-assets-*
          path: .signing-tooling/release-assets
          merge-multiple: true

      - name: Verify updater asset set before signing
        working-directory: .signing-tooling
        env:
          UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
        run: node scripts/verify-release-assets.mjs release-assets "${{ env.RELEASE_TAG }}" "${{ github.repository }}" - "" --unsigned

      - name: Sign updater assets in protected environment
        working-directory: .signing-tooling
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-signing.key"
          trap 'shred -u "$KEY_PATH" 2>/dev/null || rm -f "$KEY_PATH"' EXIT
          RAW="$TAURI_SIGNING_PRIVATE_KEY"
          if printf '%s' "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s' "$RAW" > "$KEY_PATH"
            printf '\n' >> "$KEY_PATH"
          elif DECODED=$(printf '%s' "$RAW" | base64 --decode 2>/dev/null) && printf '%s' "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s' "$DECODED" > "$KEY_PATH"
            printf '\n' >> "$KEY_PATH"
          else
            ONE=$(printf '%s' "$RAW" | tr -d '\r' | tr -d '\n')
            if ! printf '%s' "$ONE" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY format is invalid"
              exit 1
            fi
            printf '%s\n%s\n' 'untrusted comment: tauri signing key' "$ONE" > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          required=(
            "Chimera-Switch-$RELEASE_TAG-macOS.tar.gz"
            "Chimera-Switch-$RELEASE_TAG-Windows.msi"
            "Chimera-Switch-$RELEASE_TAG-Windows-arm64.msi"
            "Chimera-Switch-$RELEASE_TAG-Linux-x86_64.AppImage"
            "Chimera-Switch-$RELEASE_TAG-Linux-arm64.AppImage"
          )
          for name in "${required[@]}"; do
            file="release-assets/$name"
            [ -s "$file" ] || { echo "::error::Missing updater artifact: $name"; exit 1; }
            rm -f "$file.sig"
            pnpm tauri signer sign --private-key-path "$KEY_PATH" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$file"
            [ -s "$file.sig" ] || { echo "::error::Signing produced no signature: $name"; exit 1; }
          done
          node scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" - "$UPDATER_PUBLIC_KEY"

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-assets
          path: .signing-tooling/release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [validate-release, release, sign-release-assets]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-assets
          path: release-assets

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Verify complete signed updater asset set
        shell: bash
        run: |
          set -euo pipefail
          node .release-scripts/scripts/verify-release-assets.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY" - "$UPDATER_PUBLIC_KEY"

      - name: Create or reuse prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          set -euo pipefail
          # The build ran from the immutable SHA resolved before the matrix
          # started. Re-check the remote tag immediately before publishing so a
          # moved tag cannot receive assets built from a different commit.
          refs=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          remote_sha=$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/'"$RELEASE_TAG"'^{}" {print $1; exit}')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG moved during the build ($remote_sha != $RELEASE_SHA); refusing to publish mismatched assets."
            exit 1
          fi

          cat > release-notes.md <<EOF
          ## Chimera Switch $RELEASE_TAG

          🌐 **Only Official Website / 唯一官方网站 / 唯一の公式サイト**: [api.chimerahub.org](https://api.chimerahub.org)

          Claude Code 供应商切换工具

          ### 下载

          - macOS: Chimera-Switch-$RELEASE_TAG-macOS.dmg（推荐）或 Chimera-Switch-$RELEASE_TAG-macOS.zip（解压即用）
          - Windows (x86_64): Chimera-Switch-$RELEASE_TAG-Windows.msi（安装版）或 Chimera-Switch-$RELEASE_TAG-Windows-Portable.zip（绿色版）
          - Windows (ARM64): Chimera-Switch-$RELEASE_TAG-Windows-arm64.msi（安装版）或 Chimera-Switch-$RELEASE_TAG-Windows-arm64-Portable.zip（绿色版）
          - Linux (x86_64): Chimera-Switch-$RELEASE_TAG-Linux-x86_64.AppImage / .deb / .rpm
          - Linux (ARM64): Chimera-Switch-$RELEASE_TAG-Linux-arm64.AppImage / .deb / .rpm

          > .tar.gz 为 Tauri updater 自动更新专用，无需手动下载。

          ---
          macOS 版本未签名：首次打开请在「系统设置 → 隐私与安全性」点击「仍要打开」，或右键应用选「打开」。
          EOF
          if release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null); then
            if [ "$(printf '%s' "$release_json" | jq -r '.isDraft')" = true ]; then
              echo "::error::Release $RELEASE_TAG is a draft; refusing to publish or mutate its state."
              exit 1
            fi
            echo "Reusing existing release $RELEASE_TAG without changing its stable/prerelease state."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Chimera Switch $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Upload missing assets and verify immutable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf existing-release-assets
          mkdir -p existing-release-assets
          release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          existing=$(printf '%s' "$release_json" | jq -r '.assets[].name')
          if [ -n "$existing" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-release-assets
          fi
          while IFS= read -r file; do
            name=$(basename "$file")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              if ! cmp -s "$file" "existing-release-assets/$name"; then
                echo "::error::Release asset $name already exists with different content; refusing to overwrite it."
                exit 1
              fi
              echo "Verified existing immutable asset: $name"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
              echo "Uploaded missing asset: $name"
            fi
          done < <(find release-assets -maxdepth 1 -type f -print | sort)

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: [validate-release, publish-release]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: .release-scripts
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Prepare GH
        run: |
          gh --version || (type -p curl >/dev/null && sudo apt-get update && sudo apt-get install -y gh || true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="$RELEASE_TAG"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true
      - name: Generate and validate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ3MDQ4MDk2MEZCNTdEMjEKUldRaGZiVVBsb0FFUjJDTC9rRi9UVEo2bEZOb1ZlL1FuWHJPN25ldGJ2UFlrcHJEaDV3UWhVc0YK
        run: |
          set -euo pipefail
          node .release-scripts/scripts/generate-latest-json.mjs dl "$TAG" "$REPO" latest.json
          node .release-scripts/scripts/verify-release-assets.mjs dl "$TAG" "$REPO" latest.json "$UPDATER_PUBLIC_KEY"
          echo "Generated latest.json:"
          cat latest.json
      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            | jq -r '.assets[].name' | grep -Fx 'latest.json' || true)
          if [ -n "$existing" ]; then
            rm -rf existing-latest && mkdir existing-latest
            gh release download "$RELEASE_TAG" --pattern latest.json --dir existing-latest --repo "$GITHUB_REPOSITORY"
            if ! cmp -s latest.json existing-latest/latest.json; then
              echo "::error::latest.json already exists for $RELEASE_TAG but differs; refusing to overwrite an immutable release asset."
              exit 1
            fi
            echo "Existing latest.json is byte-identical; leaving it untouched."
          else
            gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY"
          fi
